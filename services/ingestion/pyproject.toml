[project]
name = "anr-ingestion"
version = "0.0.0"
description = "Fetches sources, extracts text, deduplicates, tiers and stores leads."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "httpx>=0.28",
    "feedparser>=6.0",
    "trafilatura>=2.3",
    "anr-schemas",
    "psycopg[binary]>=3.3.6",
    "psycopg-pool>=3.3.3",
    "py3langid>=0.4.0",
    "tldextract>=5.4.0",
    "boto3>=1.43.118",
    "lxml>=6.1.3",
]

[tool.uv.sources]
anr-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anr_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
