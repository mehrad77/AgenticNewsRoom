[project]
name = "anr-ingestion"
version = "0.0.0"
description = "Fetches sources, extracts text, deduplicates, tiers and stores leads."
requires-python = ">=3.13"
dependencies = ["fastapi>=0.162", "uvicorn>=0.54", "httpx>=0.28", "feedparser>=6.0", "trafilatura>=2.3", "anr-schemas"]

[tool.uv.sources]
anr-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anr_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
