[project]
name = "anr-verifier"
version = "0.0.0"
description = "The verifier's code checks on drafts: schema, quotes, source independence, beats, items, disclosure."
requires-python = ">=3.13"
dependencies = ["fastapi>=0.162", "uvicorn>=0.54", "anr-schemas"]

[tool.uv.sources]
anr-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anr_verifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
