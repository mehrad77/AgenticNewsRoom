[project]
name = "anr-schemas"
version = "0.0.0"
description = "Pydantic models generated from ANR's JSON Schemas. Do not edit generated modules."
requires-python = ">=3.13"
dependencies = ["pydantic>=2.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anr_schemas"]
