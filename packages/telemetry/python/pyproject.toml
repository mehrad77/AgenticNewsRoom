[project]
name = "anr-telemetry"
version = "0.0.0"
description = "OpenTelemetry setup for ANR's Python services (D137): traces, metrics and logs over OTLP, scrubbed of reader data."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162",
    "httpx>=0.28",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-httpx==0.66b2",
    "opentelemetry-instrumentation-logging==0.66b2",
    "opentelemetry-instrumentation-psycopg==0.66b2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anr_telemetry"]
