packages:
  - apps/*
  - services/*
  - packages/*
  - tools/legacy-import

# pnpm 11 fails an install on any dependency build script not decided here: true runs it, false
# leaves it unrun. @parcel/watcher (via @tailwindcss/cli) only compiles from source when asked to;
# its prebuilt platform package is what runs.
allowBuilds:
  esbuild: true
  sharp: true
  dbmate: true
  "@parcel/watcher": false
  # Via the OTLP exporters (@anr/telemetry): its postinstall only checks its optional CLI's versions.
  protobufjs: false
