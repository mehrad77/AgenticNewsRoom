# Role -> provider and model, for the model router in apps/agents.
# Agents name a role, never a model. A newsroom may override this file in its own folder.
roles:
  planner: { provider: gemini, model: gemini-3.1-pro-preview }
  desk:
    default: { provider: gemini, model: gemini-3.1-pro-preview }
    by_format:
      newsletter-issue: { provider: gemini, model: gemini-3.8-flash }
  renderer: { provider: gemini, model: gemini-3.8-flash }
  fact-checker:
    # Ordered: the router picks the first candidate that did not write the story.
    candidates:
      - { provider: gemini, model: gemini-3.8-flash }
      - { provider: gemini, model: gemini-3.1-pro-preview }
  item-matcher: { provider: gemini, model: gemini-3.8-flash }
  summariser: { provider: gemini, model: gemini-3.5-flash-lite }
tts: { provider: gemini, model: gemini-3.8-flash-tts }
