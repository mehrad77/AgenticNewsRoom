# Providers, a model catalog, and per role an ordered chain of catalog ids (D23, D72).
# Agents name a role, never a model; apps/agents/src/router.ts picks the chain and @anr/models
# calls it, falling through the chain when a model is rate-limited or gone.
# ANR_MODELS=free selects models.free.yaml instead (development only).
# Local models on this Mac write and check first; Gemini is their fallback (D183).
providers:
  # Local text-to-speech servers (tools/tts-eval/serve.py), one per engine, on this machine (D113).
  chatterbox-local: { kind: local-tts, base_url: "http://127.0.0.1:8601", timeout_s: 600 }
  xtts-local: { kind: local-tts, base_url: "http://127.0.0.1:8602", timeout_s: 600 }
  dia-local: { kind: local-tts, base_url: "http://127.0.0.1:8603", timeout_s: 900 }
  gemini: { kind: google, key_env: GEMINI_API_KEY }
  anthropic: { kind: anthropic, key_env: ANTHROPIC_API_KEY }
  # LM Studio on the host, reached from the containers (D183). Load both models with a 64k context.
  lmstudio:
    kind: openai
    base_url: http://host.docker.internal:1234/v1
    timeout_s: 600

# Prices: USD per million tokens, paid tier, from https://ai.google.dev/gemini-api/docs/pricing
# (read 2026-10-27). Every model a role uses needs one, so budgets can count spend (D82).
models:
  gemini-pro:
    provider: gemini
    model: gemini-3.1-pro-preview
    family: gemini-3.1-pro
    tools: true
    price: { in: 2.0, out: 12.0 } # prompts up to 200k tokens
  gemini-flash:
    provider: gemini
    model: gemini-3.8-flash
    family: gemini-3.8-flash
    tools: true
    price: { in: 0.75, out: 3.75 } # until 2026-12-31; 1.50 / 7.50 from 2027-01-01
  gemini-flash-lite:
    provider: gemini
    model: gemini-3.5-flash-lite
    family: gemini-3.5-flash-lite
    tools: true
    price: { in: 0.3, out: 2.5 }
  gemini-flash-tts:
    provider: gemini
    model: gemini-3.8-flash-tts
    family: gemini-3.8-flash-tts
    tools: false
    languages: [fa, en, tr]
    price: { in: 0.5, out: 9.0 } # text in, audio out; until 2026-12-31; 1.00 / 18.00 from 2027-01-01

  # Claude, from the Claude API pricing page (read 2026-10-06). In no role chain yet: chains are
  # chosen at the editor's desk.
  claude-opus:
    provider: anthropic
    model: claude-opus-5-5
    family: claude-opus-5-5
    tools: true
    price: { in: 4.0, out: 20.0 }
  claude-sonnet:
    provider: anthropic
    model: claude-sonnet-5-5
    family: claude-sonnet-5-5
    tools: true
    price: { in: 2.0, out: 10.0 }
  claude-haiku:
    provider: anthropic
    model: claude-haiku-5-5
    family: claude-haiku-5-5
    tools: true
    price: { in: 0.1, out: 0.5 } # prompts up to 100k tokens; 0.50 / 2.50 beyond

  # Local models: free to run, so priced at 0 (D82, D84).
  lmstudio-gpt-oss-20b:
    provider: lmstudio
    model: openai/gpt-oss-20b
    family: gpt-oss-20b
    tools: true
    price: { in: 0, out: 0 }
  lmstudio-gemma-12b:
    provider: lmstudio
    model: google/gemma-4-12b
    family: gemma-4-12b
    tools: true
    # Thinking on, it spent 13-18k tokens reasoning per desk call and answered in 3 (D85).
    reasoning_effort: none
    price: { in: 0, out: 0 }

  # Local TTS engines: free to run, so priced at 0 (D82). Licences: tools/tts-eval/README.md.
  chatterbox:
    provider: chatterbox-local
    model: chatterbox-multilingual
    family: chatterbox
    tools: false
    languages: [en, tr]
    price: { in: 0, out: 0 }
  xtts:
    provider: xtts-local
    model: xtts-v2
    family: xtts
    tools: false
    languages: [en, tr]
    price: { in: 0, out: 0 } # Coqui Public Model License: non-commercial only
  dia:
    provider: dia-local
    model: dia-1.6b
    family: dia
    tools: false
    languages: [en]
    price: { in: 0, out: 0 }

roles:
  planner: [lmstudio-gpt-oss-20b, gemini-pro]
  # gpt-oss writes; Gemma 4 12B cannot do the desk's claims step (D84).
  desk:
    default: [lmstudio-gpt-oss-20b, gemini-pro]
    by_format:
      newsletter-issue: [lmstudio-gpt-oss-20b, gemini-flash]
  # The desk's first model, so a story has one writer family for the fact-checker to avoid.
  renderer: [lmstudio-gpt-oss-20b, gemini-flash]
  # The router drops every family that wrote the story, then tries the rest in order.
  fact-checker: [lmstudio-gemma-12b, lmstudio-gpt-oss-20b, gemini-flash, gemini-pro]
  item-matcher: [lmstudio-gemma-12b, lmstudio-gpt-oss-20b, gemini-flash]
  summariser: [lmstudio-gemma-12b, gemini-flash-lite]
tts: gemini-flash-tts
# The engines the platform admin may enable; each newsroom picks one per language (D113).
tts_engines: [gemini-flash-tts, chatterbox, xtts, dia]
