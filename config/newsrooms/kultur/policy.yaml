# Each beat: its status, and the IPTC Media Topics that classify it
# (codes in packages/schemas/iptc/mediatopic.json; publications carry their beat's topics).
beats:
  music:
    status: open
    media_topics: [medtop:20000018] # music
    description: Music and musicians - rock, indie, pop, electronic, punk and other genres; releases, tours, scenes
  visual-art:
    status: open
    media_topics: [medtop:20000031] # visual arts
    description: Visual art and artists - exhibitions, works, galleries
  audio-art:
    status: open
    media_topics: [medtop:20000002] # arts and entertainment
    description: Sound and audio art beyond music releases - installations, sound pieces, audio works
  politics:
    status: restricted
    media_topics: [medtop:20000588, medtop:20001132] # censorship and freedom of speech, cultural policy
    description: Artists' political statements, court cases, bans, censorship and cultural policy
  private-life:
    status: banned
    media_topics: [medtop:20000505, medtop:20001300] # celebrity, privacy
    description: Artists' relationships, health and rumours
sources:
  min_independent: 2
  tier1_alone: true # the artist's or label's own statement
auto_publish: [] # every piece is themed and waits for an editor
opinion: allowed_marked # opinion is labelled and never carries a factual claim
# Model spend per calendar month (D76): writing pauses at monthly_usd - check_reserve_usd.
budget: { monthly_usd: 30, check_reserve_usd: 3 }
