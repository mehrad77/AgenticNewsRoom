# Sources start without terms_checked, so ingestion does not schedule them until a person
# has read each source's terms (linked above each entry) and set the date (D17). Each URL was
# checked on 2026-10-29: it answers, and robots.txt lets ANR-Ingestion fetch it.
- {
    id: musicbrainz,
    kind: api,
    url: "https://musicbrainz.org/ws/2/",
    publisher: MusicBrainz,
    tier: 2,
    every: 24h,
    use: enrichment,
  }

