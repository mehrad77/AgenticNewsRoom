# The AI newsroom's sources. Each URL was checked on 2026-10-26 (it answers, and robots.txt lets
# ANR-Ingestion fetch it). None is fetched until a person has read its terms (link above each
# entry) and set `terms_checked` to that date (D17); `terms_note` records anything worth keeping.
#
# Lab blogs are tier 1: a lab's own post is a primary source for what the lab says it did.

# Terms: https://openai.com/policies/terms-of-use/ (answers 403 to scripts; open it in a browser)
- {
    id: openai-news,
    kind: rss,
    url: "https://openai.com/news/rss.xml",
    publisher: OpenAI,
    tier: 1,
    every: 1h,
  }
# Terms: https://www.anthropic.com/legal (no feed: the news listing page is read for post links)
- {
    id: anthropic-news,
    kind: site,
    url: "https://www.anthropic.com/news",
    publisher: Anthropic,
    tier: 1,
    every: 2h,
  }
# Terms (all Google sites): https://policies.google.com/terms
- {
