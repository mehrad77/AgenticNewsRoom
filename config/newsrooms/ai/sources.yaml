# arXiv: one query over all the newsroom's categories, so a paper's primary category is judged
# against all of them (D59); separate sources per category would make tiers depend on which ran
# first. Terms: https://info.arxiv.org/help/api/tou.html (one request every 3 seconds). The API
# host's robots.txt disallows all crawlers; API calls follow the API terms instead (D64).
# Every 6 hours, at most 50 new papers a run: at most 200 summaries a day from arXiv.
- {
    id: arxiv,
    kind: api,
    url: "https://export.arxiv.org/api/query?search_query=cat:cs.AI+OR+cat:cs.CL+OR+cat:cs.LG&sortBy=submittedDate",
    publisher: arXiv,
    tier: 2,
    every: 6h,
    terms_checked: 2026-10-27,
    terms_note: "arXiv API ToU: 1 request per 3 s on one connection; metadata and abstracts CC0; never serve e-prints.",
  }

# Hacker News: metadata only, tier 3 (D60). Terms: https://github.com/HackerNews/API and
# https://www.ycombinator.com/legal/
- {
    id: hn-front,
    kind: api,
    url: "https://hacker-news.firebaseio.com/v0/topstories.json",
    publisher: Hacker News,
    tier: 3,
    every: 2h,
    terms_checked: 2026-10-27,
    terms_note: "HN Firebase API is the sanctioned route; YC ToU bans site scraping. Metadata only, story URLs not fetched.",
  }

# Enrichment only, never leads: venues and citations for the paper tier rules (D59).
# Terms: https://www.semanticscholar.org/product/api/license
- {
    id: semantic-scholar,
    kind: api,
    url: "https://api.semanticscholar.org/graph/v1",
    publisher: Semantic Scholar,
    tier: 2,
    every: 24h,
    use: enrichment,
    terms_checked: 2026-10-27,
    terms_note: "S2 API License: credit Semantic Scholar where its data is used; data CC BY-NC / ODC-BY; back off on 429.",
  }

