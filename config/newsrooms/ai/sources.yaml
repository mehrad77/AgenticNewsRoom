# The AI newsroom's sources. Each URL was checked on 2026-10-26 (it answers, and robots.txt lets
# ANR-Ingestion fetch it). None is fetched until a person has read its terms (link above each
# entry) and set `terms_checked` to that date (D17); `terms_note` records anything worth keeping.
# Terms read 2026-10-27. Not approved, so never scheduled: meta-ai-blog, xai-news, cohere-blog
# (their terms ban automated access or the page blocks scripts) and qwen-blog (feed dead since 2025-09).
# Vouch-only sources (D187): their terms confirmed by the editor on 2026-11-04, except meta-newsroom
# (Meta's terms, the same ones that kept meta-ai-blog off).
#
# Lab blogs are tier 1: a lab's own post is a primary source for what the lab says it did.

# Terms: https://openai.com/policies/terms-of-use/ (answers 403 to scripts; open it in a browser)
- {
    id: openai-news,
    kind: rss,
    url: "https://openai.com/news/rss.xml",
    publisher: OpenAI,
    tier: 1,
    every: 1h,
    terms_checked: 2026-10-27,
    terms_note: "ToU 2026-01-01 bans programmatic extraction; the feed is an offered channel.",
    # Other sections of the same site (D187), under the terms read for it.
    vouches:
      [
        "https://developers.openai.com/api",
        "https://help.openai.com/en",
        "https://platform.openai.com/docs",
        "https://alignment.openai.com/misalignment-reports",
      ],
  }
# Terms: https://www.anthropic.com/legal (no feed: the news listing page is read for post links)
- {
    id: anthropic-news,
    kind: site,
    url: "https://www.anthropic.com/news",
    publisher: Anthropic,
    tier: 1,
    every: 2h,
    terms_checked: 2026-10-27,
    terms_note: "Consumer Terms 2025-10-08 ban scraping Services incl. websites; scope over /news unclear. EIC approved.",
    # Other sections of the same site (D187), under the terms read for it.
    vouches: ["https://www.anthropic.com/research", "https://www.anthropic.com/engineering"],
  }
# Terms (all Google sites): https://policies.google.com/terms
