openapi: 3.1.0
info:
  title: ANR API
  version: 0.0.0
  description: >-
    Reads and writes for people at the editor's desk (reader sites read Postgres directly), in a desk
    session through Cloudflare Access or with a personal token, which acts as its person (D189, D191).
    Every operation a token may call is also a tool of the MCP server at /mcp (D190). Contract-first:
    change this file, run `pnpm gen`, then implement. ANR's newsroom agents never call this API.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
security: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check
      tags: [ops]
      responses:
        "200":
          description: The API process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /desk/me:
    get:
      operationId: getDeskMe
      summary: The signed-in person and the newsrooms they belong to
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      responses:
        "200":
          description: The person and their memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeskMe"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /desk/me/tokens:
    get:
      operationId: listMyTokens
      summary: Your personal tokens
      description: Only in a desk session through Cloudflare Access, never with a token (D191).
      tags: [tokens]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: Your tokens, newest first; never the tokens themselves.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PersonalToken" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: issueMyToken
      summary: Issue a personal token for an agent of your own
      description: >-
        Only in a desk session through Cloudflare Access (D191). The token acts as you, with your roles,
        until it expires or you revoke it; what it does is yours and audited with the token (D189).
      tags: [tokens]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueTokenRequest"
      responses:
        "201":
          description: The token, shown this once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/me/tokens/{token}/revoke:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: revokeMyToken
      summary: Revoke one of your personal tokens
      description: Only in a desk session through Cloudflare Access (D191).
      tags: [tokens]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: The token, revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /desk/admin/tokens:
    get:
      operationId: listAllTokens
      summary: Every person's personal tokens
      description: Platform admin only, in a desk session through Cloudflare Access (D191).
      tags: [tokens]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: Every token, newest first; never the tokens themselves.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PersonalTokenWithEmail" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/admin/tokens/{token}/revoke:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: revokeAnyToken
      summary: Revoke anyone's personal token
      description: Platform admin only, in a desk session through Cloudflare Access (D191).
      tags: [tokens]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: The token, revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /desk/newsrooms/{newsroom}/members:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: listMembers
      summary: The newsroom's people and their roles
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      responses:
        "200":
          description: Members, the Editor-in-Chief first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: addMember
      x-anr-who: editor-in-chief
      summary: Add a person to the newsroom by email
      description: >-
        Creates the user if there is none; they sign in through Cloudflare Access with that email.
        Audited. 409 if they are a member already.
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "201":
          description: The new member.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/members/{member}/role:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Member"
    post:
      operationId: setMemberRole
      x-anr-who: editor-in-chief
      summary: Change a member's role
      description: Audited. 409 if it would leave the newsroom without an Editor-in-Chief.
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMemberRoleRequest"
      responses:
        "200":
          description: The member.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/members/{member}:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Member"
    delete:
      operationId: removeMember
      x-anr-who: editor-in-chief
      summary: Remove a person from the newsroom
      description: Audited. 409 if it would leave the newsroom without an Editor-in-Chief.
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user_id, removed]
                properties:
                  user_id: { type: string, format: uuid }
                  removed: { type: boolean, const: true }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/audit:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: listAudit
      summary: The newsroom's audit log, newest first
      description: >-
        Every approval, edit and change, with the person and, when they acted through an agent, the
        personal token (D189). Filter by `token` to see what one agent did.
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      parameters:
        - {
            name: action,
            in: query,
            schema: { type: string },
            description: "Such as approve, edit or add-member.",
          }
        - {
            name: entity,
            in: query,
            schema: { type: string },
            description: "The table acted on, such as publications.",
          }
        - { name: entity_id, in: query, schema: { type: string, format: uuid } }
        - { name: person, in: query, schema: { type: string }, description: "A person's email." }
        - {
            name: token,
            in: query,
            schema: { type: string, format: uuid },
            description: "A personal token's id.",
          }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 100 },
          }
      responses:
        "200":
          description: Audit entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/newsrooms/{newsroom}/agent-runs:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: listAgentRuns
      summary: Agent runs, newest first
      description: What each agent did, on which model, at what cost, and how it ended.
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      parameters:
        - {
            name: role,
            in: query,
            schema: { type: string },
            description: "planner, desk, renderer, fact-checker, item-matcher or summariser.",
          }
        - {
            name: outcome,
            in: query,
            schema: { type: string, enum: [submitted, invalid, error, timed-out, running] },
          }
        - { name: story, in: query, schema: { type: string, format: uuid } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 100 },
          }
      responses:
        "200":
          description: Agent runs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentRunRow" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/newsrooms/{newsroom}/agent-runs/{run}:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - name: run
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAgentRun
      summary: One agent run, with its task and how it ended
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AgentRunRow"
                  - type: object
                    properties:
                      task: { description: What the run was asked. }
                      detail: { description: "How it ended, such as an error." }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /desk/newsrooms/{newsroom}/leads:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: listLeads
      summary: The lead pool, newest first
      description: Headlines, summaries and sources of stored leads; internal input, never shown to readers.
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      parameters:
        - { name: source, in: query, schema: { type: string }, description: "A source's slug." }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - {
            name: q,
            in: query,
            schema: { type: string, maxLength: 200 },
            description: "Words in the headline or summary.",
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
      responses:
        "200":
          description: Leads.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LeadRow" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/newsrooms/{newsroom}/sources/{source}/fetch:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - name: source
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: The source's id, from listSourceHealth.
    post:
      operationId: fetchSource
      summary: Fetch a source now instead of at its next interval
      description: >-
        Queues the source's fetch, as its schedule would; one at a time per source. 409 when nobody has
        read its terms (it is never fetched then, D17) or it does not bring leads. Audited.
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      responses:
        "200":
          description: Queued, or already queued.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, slug, queued]
                properties:
                  id: { type: string, format: uuid }
                  slug: { type: string }
                  queued:
                    { type: boolean, description: False when a fetch of it was queued already. }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/admin/audit:
    get:
      operationId: listPlatformAudit
      summary: The platform audit log, newest first
      description: Platform admin only. Settings, ops controls, models and the admin role, with the token if any.
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: person, in: query, schema: { type: string } }
        - { name: token, in: query, schema: { type: string, format: uuid } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 500, default: 100 },
          }
      responses:
        "200":
          description: Platform audit entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlatformAuditEntry" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/admin/host:
    get:
      operationId: getHostStatus
      summary: Which release runs, the database's migration, backups and restores
      description: Platform admin only; read-only (D193). Deploys and restores stay commands on the host.
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      responses:
        "200":
          description: Host status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HostStatus" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/admin/hand-over:
    post:
      operationId: handOverAdmin
      summary: Hand the platform admin's role to another person
      description: >-
        Platform admin only, in a desk session through Cloudflare Access, never with a token (D191). The
        person must already have signed up (be a member somewhere). Audited.
      tags: [tokens]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string }
      responses:
        "200":
          description: Handed over.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [email, platform_admin]
                properties:
                  email: { type: string }
                  platform_admin: { type: boolean, const: true }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/queue:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: getReviewQueue
      summary: Publications held for an editor, with the reasons they are held
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      responses:
        "200":
          description: The review queue, oldest slot first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/newsrooms/{newsroom}/publications/{publication}:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Publication"
    get:
      operationId: getDeskPublication
      summary: One publication with its text, claims, checks and posts
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      responses:
        "200":
          description: The publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeskPublication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /desk/newsrooms/{newsroom}/publications/{publication}/approve:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Publication"
    post:
      operationId: approvePublication
      summary: Approve a held publication; it goes out at its slot, or at once if that has passed
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequest"
      responses:
        "200":
          description: Scheduled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/publications/{publication}/return:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Publication"
    post:
      operationId: returnPublication
      summary: Return a held publication's assignment to the desk for a new draft
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnRequest"
      responses:
        "200":
          description: Back with the desk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/posts/{post}/resolve:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - name: post
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: resolvePost
      summary: Say whether a post with an unknown result went out
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolvePostRequest"
      responses:
        "200":
          description: Resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/channels:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: listChannels
      summary: The newsroom's channels; credentials are never returned
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      responses:
        "200":
          description: Channels.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: addChannel
      x-anr-who: editor-in-chief
      summary: Add a channel (Editor-in-Chief); its credentials are sealed with the platform key
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewChannel"
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/newsrooms/{newsroom}/channels/{channel}/status:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - name: channel
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: setChannelStatus
      x-anr-who: editor-in-chief
      summary: Turn a channel on or off (Editor-in-Chief)
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelStatusRequest"
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /desk/newsrooms/{newsroom}/samples:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: listSamples
      summary: Auto-published publications sampled for review, unreviewed first
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      responses:
        "200":
          description: Samples.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sample"
