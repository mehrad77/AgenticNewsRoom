      description: Platform admin only; audited. The setting is kept as null, which reads as the models file's chains.
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      responses:
        "200":
          description: Reset; the catalog and chains now in force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModels"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/admin/models/local:
    get:
      operationId: getLocalModels
      summary: The language models on the local model server (LM Studio), and which are loaded
      description: Platform admin only. The server is the models file's OpenAI-compatible provider at a plain-http address; its native REST API is asked with a 5 second timeout.
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      responses:
        "200":
          description: The server's language models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalModels"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /desk/admin/models/local/load:
    post:
      operationId: loadLocalModel
      summary: Load a model on the local model server
      description: Platform admin only; audited. The context length defaults to 65536, or the model's maximum when that is smaller. Loading takes some seconds.
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalModelLoad"
      responses:
        "200":
          description: Loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalModelLoaded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /desk/admin/models/local/unload:
    post:
      operationId: unloadLocalModel
      summary: Unload a loaded instance from the local model server
      description: Platform admin only; audited.
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalModelUnload"
      responses:
        "200":
          description: Unloaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsDone"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /desk/newsrooms/{newsroom}/tts:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: getNewsroomTts
      summary: The newsroom's TTS engine per language, and what each language would use now
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      responses:
        "200":
          description: One row per newsroom language.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsroomTts"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: setNewsroomTts
      x-anr-who: editor-in-chief
      summary: Choose the engine for one language, or clear the choice to use the default
      description: Editor-in-Chief only; audited (D113).
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsroomTtsRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /reader/newsrooms/{newsroom}/publications/{publication}/challenges:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Publication"
    post:
      operationId: submitChallenge
      summary: A reader challenges a published piece (D114)
      description: >-
        Public: called by the newsroom's site for its reader form. Nothing about the reader is stored; the
        rate limit keys on an HMAC of the reader's network (CF-Connecting-IP, an IPv6 /64; never X-Forwarded-For)
        under a random secret dropped after the day. The receipt's token opens the reader's status page
        and is stored only as its hash.
      tags: [reader]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeRequest"
      responses:
        "201":
          description: Received; owned by the newsroom's corrections owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /desk/newsrooms/{newsroom}/challenges:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: listChallenges
      summary: Readers' challenges, open ones first, with their deadlines
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      responses:
        "200":
          description: Challenges.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Challenge"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/newsrooms/{newsroom}/challenges/{challenge}:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Challenge"
    get:
      operationId: getChallenge
      summary: One challenge, with the story's claims and every publication a correction would cover
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      responses:
        "200":
          description: The challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /desk/newsrooms/{newsroom}/challenges/{challenge}/acknowledge:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Challenge"
    post:
      operationId: acknowledgeChallenge
      summary: Acknowledge a challenge, with an optional note the reader sees
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcknowledgeRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/challenges/{challenge}/reject:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Challenge"
    post:
      operationId: rejectChallenge
      summary: Answer a challenge without a correction; the reader sees the answer
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/challenges/{challenge}/uphold:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Challenge"
    post:
      operationId: upholdChallenge
      summary: Uphold a challenge, correcting every affected publication and checking the corrected claim (D115, D116)
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpholdRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/challenges/{challenge}/issue:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Challenge"
    post:
      operationId: fileChallengeIssue
      summary: Record the issue an upheld challenge's lesson was filed as
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/media:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: listMedia
      summary: The newsroom's images, unlicensed first
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      responses:
        "200":
          description: Up to 200 media items.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MediaItem" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: addMedia
      summary: Add an image by URL; ingestion fetches it and reads its Photo Metadata
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaAddRequest"
      responses:
        "202":
          description: Queued. The item appears once read, or a media-failed notice.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [queued]
                properties:
                  queued: { type: boolean }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /desk/newsrooms/{newsroom}/media/{media}/licence:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Media"
    post:
      operationId: recordPressKit
      summary: Record that a press kit allows press use, with the credit
      tags: [desk]
      security: [{ cfAccess: [] }, { personalToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PressKitRequest"
      responses:
        "200":
          description: Recorded; it can no longer change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
tags:
  - name: ops
    description: Operational endpoints.
  - name: desk
    description: >-
      The editor's desk, behind Cloudflare Access, or with a personal token. Every request carries
      the Access JWT or the token; the API maps it to a user and checks a membership in the newsroom
      named in the path. Every approval and edit is written to the audit log, with the token if any.
  - name: tokens
    description: >-
      Personal tokens (D191), managed only in a desk session through Cloudflare Access.
  - name: reader
    description: >-
      Public writes from a newsroom's site on a reader's behalf: no sign-in, nothing stored about the
      reader, rate-limited.
components:
  securitySchemes:
    cfAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: The Cloudflare Access JWT, verified against the team's signing keys and audience.
    personalToken:
      type: http
      scheme: bearer
      description: >-
        A personal token (`anr_…`), issued at the desk; it acts as the person who issued it, with their
        roles and nothing more (D189, D191).
  parameters:
    Newsroom:
      name: newsroom
      in: path
      required: true
      description: The newsroom's slug.
      schema: { type: string, pattern: "^[a-z][a-z0-9-]*$" }
    Member:
      name: member
      in: path
      required: true
      description: The member's user id, from listMembers.
      schema: { type: string, format: uuid }
    Publication:
      name: publication
      in: path
      required: true
      schema: { type: string, format: uuid }
    Challenge:
      name: challenge
      in: path
      required: true
      schema: { type: string, format: uuid }
    Media:
      name: media
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: The request body is not valid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No valid Cloudflare Access JWT or personal token, or no user for it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: No membership in this newsroom, or a role that cannot do this.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Nothing with that id in this newsroom.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The row is not in a state that allows this.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Too many challenges from this reader, or to this piece, today.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: A server the API asked for the admin (the local model server) refused or failed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: A server the API asks for the admin (the local model server) is not running.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: api
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
        problems:
          type: array
          description: Each problem, when the request was refused for several (role chains).
          items: { type: string }
    OpsDone:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok: { type: boolean }
    OpsPauseRequest:
      type: object
      additionalProperties: false
      properties:
        newsroom: { type: string, description: "A newsroom's slug; without one, every newsroom." }
    OpsResumed:
      type: object
      additionalProperties: false
      required: [held]
      properties:
        held:
          type: array
          description: Publications held as missed slots on resuming.
          items: { type: string, format: uuid }
    OpsDrainRequest:
      type: object
      additionalProperties: false
      required: [queue, drained]
      properties:
        queue: { type: string }
        drained: { type: boolean }
    OpsJobRequest:
      type: object
      additionalProperties: false
      required: [queue, id]
      properties:
        queue: { type: string }
        id: { type: string, format: uuid }
    OpsRequested:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string, format: uuid }
    OpsJob:
      type: object
      additionalProperties: false
      required: [id, queue, newsroom, at]
      properties:
        id: { type: string, format: uuid }
        queue: { type: string }
        newsroom: { type: [string, "null"] }
        at: { type: string, format: date-time }
        error: { type: [string, "null"] }
    OpsState:
      type: object
      additionalProperties: false
      required:
        [
          paused_everywhere,
          pauses,
          queues,
          failed,
          waiting,
          backups,
          backup_requests,
          heartbeats,
          outages,
        ]
      properties:
        paused_everywhere: { type: boolean }
        pauses:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [newsroom, paused_at]
            properties:
              newsroom: { type: string }
              paused_at: { type: [string, "null"], format: date-time }
        queues:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, drainable, drained_at, waiting, active, failed]
            properties:
              name: { type: string }
              drainable: { type: boolean }
              drained_at: { type: [string, "null"], format: date-time }
              waiting: { type: integer }
              active: { type: integer }
              failed: { type: integer }
        failed: { type: array, items: { $ref: "#/components/schemas/OpsJob" } }
        waiting: { type: array, items: { $ref: "#/components/schemas/OpsJob" } }
        backups:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, started_at, finished_at, ok]
            properties:
              kind: { type: string, enum: [init, full, diff, incr, check] }
              started_at: { type: string, format: date-time }
              finished_at: { type: [string, "null"], format: date-time }
              ok: { type: [boolean, "null"] }
        backup_requests:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, requested_at, picked_at, done_at]
            properties:
              id: { type: string, format: uuid }
              requested_at: { type: string, format: date-time }
              picked_at: { type: [string, "null"], format: date-time }
              done_at: { type: [string, "null"], format: date-time }
        heartbeats:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [worker, beat_at, late]
            properties:
              worker: { type: string }
              beat_at: { type: string, format: date-time }
              late: { type: boolean }
        outages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, worker, started_at, ended_at]
            properties:
              kind: { type: string, enum: [worker, host] }
              worker: { type: [string, "null"] }
              started_at: { type: string, format: date-time }
              ended_at: { type: string, format: date-time }
    StatusResult:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
    Language:
      type: string
      enum: [fa, en, tr]
    Role:
      type: string
      enum: [editor-in-chief, editor]
    DeskMe:
      type: object
      additionalProperties: false
      required: [email, platform_admin, memberships]
      properties:
        email: { type: string }
        platform_admin:
          type: boolean
          description: The platform's one super admin, who chooses the TTS engines on offer (D113).
        memberships:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [newsroom, name, role]
            properties:
              newsroom: { type: string, description: The newsroom's slug. }
              name:
                type: object
                additionalProperties: { type: string }
              role: { $ref: "#/components/schemas/Role" }
        via_token:
          type: [string, "null"]
          description: The personal token this request came with, or null in a desk session.
    Member:
      type: object
      additionalProperties: false
      required: [user_id, email, role, since]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        since: { type: string, format: date-time }
    AddMemberRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, maxLength: 320 }
        role: { $ref: "#/components/schemas/Role" }
    SetMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    AuditEntry:
      type: object
      additionalProperties: false
      required:
        [
          id,
          at,
          actor_kind,
          person,
          agent_or_code,
          token_id,
          token_name,
          action,
          entity,
          entity_id,
          before,
          after,
        ]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actor_kind: { type: string, enum: [person, agent, code] }
        person: { type: [string, "null"], description: The person's email. }
        agent_or_code: { type: [string, "null"], description: The agent role or code component. }
        token_id:
          {
            type: [string, "null"],
            format: uuid,
            description: The personal token the person acted through.,
          }
        token_name: { type: [string, "null"] }
        action: { type: string }
        entity: { type: string }
        entity_id: { type: string, format: uuid }
        before: {}
        after: {}
    PlatformAuditEntry:
      type: object
      additionalProperties: false
      required: [id, at, person, code, token_id, token_name, action, entity, key, before, after]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        person: { type: [string, "null"] }
        code: { type: [string, "null"] }
        token_id: { type: [string, "null"], format: uuid }
        token_name: { type: [string, "null"] }
        action: { type: string }
        entity: { type: string }
        key: { type: string }
        before: {}
        after: {}
    AgentRunRow:
      type: object
      required: [id, role, provider, model, prompt_version, outcome, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        role: { type: string }
        provider: { type: string }
        model: { type: string }
        prompt_version: { type: string }
        tokens_in: { type: [integer, "null"] }
        tokens_out: { type: [integer, "null"] }
        cost_usd: { type: [number, "null"] }
        outcome: { type: string, enum: [submitted, invalid, error, timed-out, running] }
        assignment_id: { type: [string, "null"], format: uuid }
        story_id: { type: [string, "null"], format: uuid }
        lead_id: { type: [string, "null"], format: uuid }
        language: { type: [string, "null"] }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
    LeadRow:
      type: object
      additionalProperties: false
      required: [id, uri, headline, summary, language, tier, source, first_created, fetched_at]
      properties:
        id: { type: string, format: uuid }
        uri: { type: string }
        headline: { type: [string, "null"] }
        summary: { type: [string, "null"] }
        language: { type: string }
        tier: { type: integer }
        source: { type: [string, "null"], description: The source's slug. }
        first_created: { type: [string, "null"], format: date-time }
        fetched_at: { type: string, format: date-time }
    HostStatus:
      type: object
      additionalProperties: false
      required: [version, deploys, migration, backups, restores]
      properties:
        version: { type: [string, "null"], description: The release the API runs (ANR_VERSION). }
        deploys:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [tag, at, ok, detail]
            properties:
              tag: { type: string }
              at: { type: string, format: date-time }
              ok: { type: boolean }
              detail: { type: [string, "null"] }
        migration: { type: [string, "null"], description: The last applied migration's version. }
        backups:
          type: array
          description: The latest run of each kind.
          items:
            type: object
            additionalProperties: false
            required: [kind, started_at, finished_at, ok, detail]
            properties:
              kind: { type: string }
              started_at: { type: string, format: date-time }
              finished_at: { type: [string, "null"], format: date-time }
              ok: { type: [boolean, "null"] }
              detail: { type: [string, "null"] }
        restores:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [restored_at, note]
            properties:
              restored_at: { type: string, format: date-time }
              note: { type: [string, "null"] }
    PersonalToken:
      type: object
      additionalProperties: false
      required: [id, name, created_at, expires_at, last_used_at, revoked_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
    PersonalTokenWithEmail:
      allOf:
        - $ref: "#/components/schemas/PersonalToken"
        - type: object
          required: [email]
          properties:
            email: { type: string }
    IssuedToken:
      allOf:
        - $ref: "#/components/schemas/PersonalToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The token itself, shown this once; only its hash is kept.
    IssueTokenRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          {
            type: string,
            minLength: 1,
            maxLength: 80,
            description: "What the token is for, such as the agent holding it.",
          }
        days:
          {
            type: integer,
            minimum: 1,
            maximum: 365,
            default: 90,
            description: "Days until it expires.",
          }
    Check:
      type: object
      additionalProperties: false
      required: [id, kind, name, result, at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [code, fact-check, item-match, policy] }
        name: { type: string }
        result: { type: string, enum: [pass, fail, partial, error, timed-out] }
        claim: { type: [string, "null"], description: "The claim's ref, such as c1, if any." }
        item: { type: [string, "null"] }
        detail: {}
        at: { type: string, format: date-time }
    QueueItem:
      type: object
      additionalProperties: false
      required: [id, series, slot, language, title, holds, unknown_posts]
      properties:
        id: { type: string, format: uuid }
        series: { type: string }
        slot: { type: string, format: date-time }
        language: { $ref: "#/components/schemas/Language" }
        title: { type: [string, "null"] }
        holds:
          type: array
          description: Every check that did not pass, oldest first.
          items: { $ref: "#/components/schemas/Check" }
        unknown_posts: { type: integer, minimum: 0 }
    Post:
      type: object
      additionalProperties: false
      required: [id, channel, kind, part, status, body]
      properties:
        id: { type: string, format: uuid }
        channel: { type: string, format: uuid }
        kind: { type: string }
        part: { type: integer, minimum: 1 }
        status: { type: string, enum: [pending, sent, unknown, failed] }
        external_id: { type: [string, "null"] }
        body: { type: string }
        error: {}
        sent_at: { type: [string, "null"], format: date-time }
    Claim:
      type: object
      additionalProperties: false
      required: [ref, kind, text]
      properties:
        ref: { type: string }
        kind: { type: string, enum: [fact, quote, opinion] }
        text: { type: string }
        lead: { type: [string, "null"], description: The cited lead's URL. }
        quoted_passage: { type: [string, "null"] }
    DeskPublication:
      type: object
      additionalProperties: false
      required:
        [
          id,
          series,
          slot,
          language,
          status,
          version,
          editable,
          rendition,
          claims,
          checks,
          posts,
          runs,
          cost_usd,
          trace_id,
        ]
      properties:
        id: { type: string, format: uuid }
        series: { type: string }
        slot: { type: string, format: date-time }
        language: { $ref: "#/components/schemas/Language" }
        status: { type: string }
        version:
          type: string
          description: Changes whenever the publication does; approve and edit send it back and are refused if it moved.
        editable:
          type: boolean
          description: Held, with text, and no part sent or in flight.
        rendition:
          type: [object, "null"]
          description: The rendition body as the desk or renderer submitted it.
        claims:
          type: array
          items: { $ref: "#/components/schemas/Claim" }
        checks:
          type: array
          items: { $ref: "#/components/schemas/Check" }
        posts:
          type: array
          items: { $ref: "#/components/schemas/Post" }
        runs:
          type: array
          description: The agent runs behind the publication's assignment and stories.
          items: { $ref: "#/components/schemas/AgentRun" }
        cost_usd: { type: number, description: The runs' summed cost. }
        trace_id:
          type: [string, "null"]
          pattern: "^[0-9a-f]{32}$"
          description: The publication's trace (D137), from its assignment on; none for publications assigned before traces were stored.
    ApproveRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: string, maxLength: 100, description: The version the editor saw. }
    ReturnRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 2000
          description: What the desk should change; kept in the audit log.
    ResolvePostRequest:
      type: object
      additionalProperties: false
      required: [went_out]
      properties:
        went_out:
          type: boolean
          description: True if the message is on the channel (it is recorded as sent); false to send it again.
        external_id:
          type: string
          maxLength: 200
          description: The channel's id for the message, when it went out and is known.
    Channel:
      type: object
      additionalProperties: false
      required: [id, kind, language, status, has_credentials]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [site, telegram, podcast-rss] }
        language: { $ref: "#/components/schemas/Language" }
        external_id: { type: [string, "null"] }
        status: { type: string, enum: [active, disabled] }
        has_credentials: { type: boolean }
        checked_at: { type: [string, "null"], format: date-time }
        check_result:
          description: What the channel said at its last check, null before one.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ChannelCheck"
    NewChannel:
      type: object
      additionalProperties: false
      required: [kind, language]
      properties:
        kind: { type: string, enum: [site, telegram, podcast-rss] }
        language: { $ref: "#/components/schemas/Language" }
        external_id:
          type: string
          maxLength: 200
          description: The channel's own id, such as a Telegram chat id or @username.
        credentials:
          type: object
          additionalProperties: { type: string, maxLength: 500 }
          description: Secrets such as `bot_token`; sealed before they reach Postgres, never returned.
    ChannelStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [active, disabled] }
    Sample:
      type: object
      additionalProperties: false
      required: [id, publication, title, language, sampled_at]
      properties:
        id: { type: string, format: uuid }
        publication: { type: string, format: uuid }
        title: { type: [string, "null"] }
        language: { $ref: "#/components/schemas/Language" }
        sampled_at: { type: string, format: date-time }
        outcome: { type: [string, "null"], enum: [ok, miss, null] }
        note: { type: [string, "null"] }
        reviewed_at: { type: [string, "null"], format: date-time }
        issue_url: { type: [string, "null"] }
        filed_at: { type: [string, "null"], format: date-time }
    SampleReviewRequest:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome: { type: string, enum: [ok, miss] }
        note:
          type: string
          maxLength: 2000
          description: What the gate should have caught, to become a new check or policy rule; required for a miss.
    Notice:
      type: object
      additionalProperties: false
      required: [id, kind, key, detail, created_at]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum:
            [
              budget-warning,
              budget-cap,
              no-leads,
              no-channel,
              no-theme,
              pick-missed,
              plan-failed,
              challenge-due,
              challenge-overdue,
              media-failed,
              slot-missed,
            ]
        key: { type: string }
        detail: {}
        created_at: { type: string, format: date-time }
        read_at: { type: [string, "null"], format: date-time }
    AgentRun:
      type: object
      additionalProperties: false
      required: [id, role, provider, model, outcome, cost_usd, started_at]
      properties:
        id: { type: string, format: uuid }
        role: { type: string }
        provider: { type: string }
        model: { type: string }
        outcome: { type: [string, "null"] }
        cost_usd: { type: [number, "null"] }
        tokens_in: { type: [integer, "null"] }
        tokens_out: { type: [integer, "null"] }
        started_at: { type: string, format: date-time }
    Preview:
      type: object
      additionalProperties: false
      required: [label, edited, site, channels]
      properties:
        label: { type: string, description: The disclosure label every part must carry. }
        edited: { type: boolean }
        site:
          type: object
          additionalProperties: false
          required: [url, html]
          properties:
            url: { type: string }
            html:
              {
                type: string,
                description: "The site template's output, as the page body shows it.",
              }
            error: { type: string, description: Why the site page cannot be rendered. }
        channels:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, configured, parts]
            properties:
              kind: { type: string }
              configured:
                {
                  type: boolean,
                  description: Whether the newsroom has an active channel of this kind and language.,
                }
              parts: { type: array, items: { type: string } }
              error:
                {
                  type: string,
                  description: Why it cannot be rendered; the publisher would hold it.,
                }
    EditRequest:
      type: object
      additionalProperties: false
      required: [version, changes]
      properties:
        version: { type: string, maxLength: 100, description: The version the editor saw. }
        changes:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [pointer, text]
            properties:
              pointer:
                type: string
                description: A JSON pointer to a text field of the first rendition, such as /items/0/body.
              text: { type: string, maxLength: 20000 }
    PullBackRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note:
          {
            type: string,
            minLength: 1,
            maxLength: 2000,
            description: Why; shown in the review queue.,
          }
    ScheduleItem:
      type: object
      additionalProperties: false
      required: [id, series, slot, language, status, title]
      properties:
        id: { type: string, format: uuid }
        series: { type: string }
        slot: { type: string, format: date-time }
        language: { $ref: "#/components/schemas/Language" }
        status: { type: string, enum: [assigned, drafted, with-editor, scheduled] }
        title: { type: [string, "null"] }
    CredentialsRequest:
      type: object
      additionalProperties: false
      required: [credentials]
      properties:
        credentials:
          type: object
          additionalProperties: { type: string, maxLength: 500 }
          description: The channel's new secrets, replacing all of the old ones.
    ChannelCheck:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok: { type: boolean }
        problem: { type: string }
        detail:
          type: object
          additionalProperties: { type: [string, boolean, "null"] }
    IssueRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, pattern: "^https://", maxLength: 500 }
    Budget:
      type: object
      additionalProperties: false
      required: [month, monthly_usd, check_reserve_usd, writing_limit_usd, spent_usd, by_role, runs]
      properties:
        month: { type: string, description: "YYYY-MM in the newsroom's timezone." }
        monthly_usd: { type: number }
        check_reserve_usd: { type: number }
        writing_limit_usd:
          { type: number, description: Where writing roles stop; checks may spend the reserve. }
        spent_usd: { type: number }
        by_role:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [role, runs, cost_usd]
            properties:
              role: { type: string }
              runs: { type: integer }
              cost_usd: { type: number }
        runs:
          type: array
          description: This month's latest runs.
          items: { $ref: "#/components/schemas/AgentRun" }
    Recheck:
      type: object
      additionalProperties: false
      required: [run, counts, causes, days]
      properties:
        run:
          description: The latest run, if any.
          oneOf:
            - $ref: "#/components/schemas/RecheckRun"
            - type: "null"
        counts:
          type: object
          additionalProperties: false
          required: [checked, waiting, running, source, claims, checks]
          properties:
            checked: { type: integer }
            waiting: { type: integer }
            running: { type: integer }
            source: { type: integer }
            claims: { type: integer }
            checks: { type: integer }
        causes:
          description: What stopped the items that are not checked, most common first.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [cause, items]
            properties:
              cause: { type: string }
              items: { type: integer }
        days:
          type: array
          items:
            $ref: "#/components/schemas/RecheckDay"
    RecheckRun:
      type: object
      additionalProperties: false
      required:
        [
          id,
          started_by,
          started_at,
          heartbeat_at,
          stop_requested,
          finished_at,
          outcome,
          detail,
          rounds,
          sourced,
          checked,
        ]
      properties:
        id: { type: string, format: uuid }
        started_by:
          { type: [string, "null"], description: "The email of the person who started it." }
        started_at: { type: string, format: date-time }
        heartbeat_at: { type: string, format: date-time }
        stop_requested: { type: boolean }
        finished_at: { type: [string, "null"], format: date-time }
        outcome:
          description: "done: nothing left; stopped: a person asked; blocked: models or ingestion unavailable, no try spent; failed: an error it could not get past."
          enum: [done, stopped, blocked, failed, null]
        detail: { type: [string, "null"] }
        rounds: { type: integer }
        sourced: { type: integer, description: "Stories sourced, over all rounds." }
        checked: { type: integer, description: "Stories checked by the gate, over all rounds." }
    RecheckDay:
      type: object
      additionalProperties: false
      required: [story_id, slot, publication_id, title, items]
      properties:
        story_id: { type: string, format: uuid }
        slot: { type: string, format: date-time }
        publication_id: { type: [string, "null"], format: uuid }
        title: { type: [string, "null"] }
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecheckItem"
    RecheckItem:
      type: object
      additionalProperties: false
      required: [index, headline, url, status, languages, reasons]
      properties:
        index: { type: integer }
        headline: { type: [string, "null"] }
        url: { type: [string, "null"] }
        status: { type: string, enum: [checked, waiting, running, source, claims, checks] }
        languages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [language, checked]
            properties:
              language: { type: string }
              checked: { type: boolean }
        reasons:
          description: Why it is not checked, first what stopped it; empty when checked or waiting.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [language, check, result, claim, reason]
            properties:
              language: { type: [string, "null"] }
              check: { type: string }
              result: { type: string }
              claim: { type: [string, "null"] }
              reason: { type: [string, "null"] }
    SourceHealth:
      type: object
      additionalProperties: false
      required: [id, slug, kind, url, tier, use, terms_checked, consecutive_failures, leads_7d]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        kind: { type: string }
        url: { type: string }
        publisher: { type: [string, "null"] }
        tier: { type: integer }
        use: { type: string }
        terms_checked: { type: [string, "null"], format: date }
        last_fetched_at: { type: [string, "null"], format: date-time }
        last_status: { type: [integer, "null"] }
        last_error: { type: [string, "null"] }
        consecutive_failures: { type: integer }
        leads_7d:
          { type: integer, description: Leads first seen from this source in the last 7 days. }
    MeasureWeek:
      type: object
      additionalProperties: false
      required:
        - week
        - published
        - gated
        - held
        - hold_rate
        - samples_reviewed
        - sample_misses
        - corrections
        - corrections_per_100
        - editor_minutes
        - cost_usd
        - cost_per_publication
        - page_views
        - downloads
      properties:
        week:
          {
            type: string,
            format: date,
            description: "The week's Monday, in the newsroom's timezone.",
          }
        published: { type: integer }
        gated: { type: integer, description: Publications in the week's slots that left the gate. }
        held: { type: integer }
        hold_rate: { type: [number, "null"] }
        samples_reviewed: { type: integer }
        sample_misses: { type: integer }
        corrections: { type: integer }
        corrections_per_100: { type: [number, "null"] }
        editor_minutes: { type: number }
        cost_usd: { type: number }
        cost_per_publication: { type: [number, "null"] }
        page_views:
          type: object
          additionalProperties: { type: integer }
          description: By language.
        downloads:
          type: object
          additionalProperties: { type: integer }
          description: By language.
    Measures:
      type: object
      additionalProperties: false
      required: [weeks, subscribers]
      properties:
        weeks:
          type: array
          description: Newest week first.
          items: { $ref: "#/components/schemas/MeasureWeek" }
        subscribers:
          type: array
          description: Each active Telegram channel's latest subscriber count.
          items:
            type: object
            additionalProperties: false
            required: [channel, language, subscribers, day]
            properties:
              channel: { type: string, format: uuid }
              language: { $ref: "#/components/schemas/Language" }
              external_id: { type: [string, "null"] }
              subscribers: { type: integer }
              day: { type: string, format: date }

    PlanLead:
      type: object
      additionalProperties: false
      required: [id, url, headline]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        headline: { type: [string, "null"] }
    CalendarWeek:
      type: object
      additionalProperties: false
      required: [week, focus]
      properties:
        week: { type: string, format: date, description: "The Monday of a week the cycle touches." }
        focus: { type: string, minLength: 1, maxLength: 240 }
    ThemeProposal:
      type: object
      additionalProperties: false
      required: [id, starts, ends, theme, angle, rationale, calendar, status, decided_at, leads]
      properties:
        id: { type: string, format: uuid }
        starts: { type: string, format: date }
        ends: { type: string, format: date, description: "The day after the cycle's last day." }
        theme: { type: string }
        angle: { type: [string, "null"] }
        rationale: { type: [string, "null"] }
        calendar:
          type: array
          items: { $ref: "#/components/schemas/CalendarWeek" }
        status: { type: string, enum: [proposed, approved, declined] }
        decided_at: { type: [string, "null"], format: date-time }
        leads:
          type: array
          items: { $ref: "#/components/schemas/PlanLead" }
    PickCandidate:
      type: object
      additionalProperties: false
      required: [title, angle, why, leads]
      properties:
        title: { type: string }
        angle: { type: string }
        why: { type: string }
        leads:
          type: array
          items: { $ref: "#/components/schemas/PlanLead" }
    WeeklyPick:
      type: object
      additionalProperties: false
      required: [id, series, week, slot, deadline, chosen, picked_at, skipped_at, candidates]
      properties:
        id: { type: string, format: uuid }
        series: { type: string }
        week: { type: string, format: date }
        slot: { type: string, format: date-time }
        deadline: { type: string, format: date-time }
        chosen: { type: [integer, "null"], minimum: 0, maximum: 2 }
        picked_at: { type: [string, "null"], format: date-time }
        skipped_at: { type: [string, "null"], format: date-time }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/PickCandidate" }
    Plan:
      type: object
      additionalProperties: false
      required: [themes, picks]
      properties:
        themes:
          type: array
          description: Proposals for the current and later cycles, newest cycle first.
          items: { $ref: "#/components/schemas/ThemeProposal" }
        picks:
          type: array
          description: Picks of the last four weeks and later, newest first.
          items: { $ref: "#/components/schemas/WeeklyPick" }
    ApproveThemeRequest:
      type: object
      additionalProperties: false
      required: [theme, angle, calendar]
      properties:
        theme: { type: string, minLength: 1, maxLength: 140 }
        angle: { type: string, minLength: 1, maxLength: 800 }
        calendar:
          type: array
          description: The same weeks as proposed, each with its focus as the Editor-in-Chief wants it.
          items: { $ref: "#/components/schemas/CalendarWeek" }
    ChoosePickRequest:
      type: object
      additionalProperties: false
      required: [candidate]
      properties:
        candidate: { type: integer, minimum: 0, maximum: 2 }
    TtsEngine:
      type: object
      additionalProperties: false
      required: [id, model, languages, local, enabled]
      properties:
        id: { type: string, description: "Catalogue id in the models file." }
        model: { type: string }
        languages:
          type: array
          items: { $ref: "#/components/schemas/Language" }
        local: { type: boolean, description: "Runs on this machine (tools/tts-eval/serve.py)." }
        enabled: { type: boolean }
    AdminTts:
      type: object
      additionalProperties: false
      required: [default, engines]
      properties:
        default:
          {
            type: string,
            description: "The models file's `tts`: used where a newsroom chose none.",
          }
        engines:
          type: array
          items: { $ref: "#/components/schemas/TtsEngine" }
    AdminTtsRequest:
      type: object
      additionalProperties: false
      required: [engines]
      properties:
        engines:
          type: array
          items: { type: string }
    ModelChain:
      type: array
      description: Catalog ids, tried in order.
      minItems: 1
      uniqueItems: true
      items: { type: string }
    ModelRoles:
      type: object
      additionalProperties: false
      description: Each role's chain, shaped like the models file's `roles`.
      required: [planner, desk, renderer, fact-checker, item-matcher, summariser]
      properties:
        planner: { $ref: "#/components/schemas/ModelChain" }
        desk:
          type: object
          additionalProperties: false
          required: [default]
          properties:
            default: { $ref: "#/components/schemas/ModelChain" }
            by_format:
              type: object
              description: A format's own chain, by format slug.
              additionalProperties: { $ref: "#/components/schemas/ModelChain" }
        renderer: { $ref: "#/components/schemas/ModelChain" }
        fact-checker: { $ref: "#/components/schemas/ModelChain" }
        item-matcher: { $ref: "#/components/schemas/ModelChain" }
        summariser: { $ref: "#/components/schemas/ModelChain" }
    CatalogModel:
      type: object
      additionalProperties: false
      required: [id, provider, provider_kind, model, family, tools, price, local]
      properties:
        id: { type: string, description: "Catalog id in the models file." }
        provider: { type: string }
        provider_kind:
          {
            type: string,
            description: "The provider's kind in the models file, such as google, openai or local-tts.",
          }
        model: { type: string, description: "The provider's model id." }
        family: { type: string, description: "The weights, whoever serves them." }
        tools: { type: boolean, description: "Supports tool calling; every role needs it." }
        price:
          type: [object, "null"]
          description: USD per million tokens; a role's model needs one.
          additionalProperties: false
          required: [in, out]
          properties:
            in: { type: number }
            out: { type: number }
        local:
          type: boolean
          description: Served by a model server on this machine (an OpenAI-compatible provider at a plain-http address).
    AdminModels:
      type: object
      additionalProperties: false
      required: [catalog, formats, roles, source, problems, file_roles]
      properties:
        catalog:
          type: array
          items: { $ref: "#/components/schemas/CatalogModel" }
        formats:
          type: array
          description: The formats a desk chain may be set for.
          items: { type: string }
        roles: { $ref: "#/components/schemas/ModelRoles" }
        source:
          type: string
          enum: [file, desk]
          description: Whether the chains in force are the models file's or the admin's.
        problems:
          type: array
          description: Why the admin's stored chains are set aside for the file's; empty otherwise.
          items: { type: string }
        file_roles: { $ref: "#/components/schemas/ModelRoles" }
    LocalModelInstance:
      type: object
      additionalProperties: false
      required: [id, context_length]
      properties:
        id: { type: string, description: "The instance id, which unloading names." }
        context_length: { type: [integer, "null"] }
    LocalModel:
      type: object
      additionalProperties: false
      required:
        [key, display_name, size_bytes, params, max_context_length, tool_use, loaded, catalog_ids]
      properties:
        key: { type: string, description: "The server's model key, which loading names." }
        display_name: { type: string }
        size_bytes: { type: [integer, "null"] }
        params: { type: [string, "null"], description: "Parameter count, such as 20B." }
        max_context_length: { type: [integer, "null"] }
        tool_use: { type: boolean, description: "Trained for tool use." }
        loaded:
          type: array
          items: { $ref: "#/components/schemas/LocalModelInstance" }
        catalog_ids:
          type: array
          description: Catalog models served by this one.
          items: { type: string }
    LocalModels:
      type: object
      additionalProperties: false
      required: [provider, url, models]
      properties:
        provider: { type: string, description: "The models file's provider for this server." }
        url: { type: string }
        models:
          type: array
          items: { $ref: "#/components/schemas/LocalModel" }
    LocalModelLoad:
      type: object
      additionalProperties: false
      required: [model]
      properties:
        model: { type: string }
        context_length: { type: integer, minimum: 4096 }
    LocalModelLoaded:
      type: object
      additionalProperties: false
      required: [model, context_length, instance_id]
      properties:
        model: { type: string }
        context_length: { type: integer }
        instance_id: { type: [string, "null"] }
    LocalModelUnload:
      type: object
      additionalProperties: false
      required: [instance_id]
      properties:
        instance_id: { type: string }
    NewsroomTtsLanguage:
      type: object
      additionalProperties: false
      required: [language, chosen, effective, source, reason, options]
      properties:
        language: { $ref: "#/components/schemas/Language" }
        chosen: { type: [string, "null"] }
        effective:
          {
            type: [string, "null"],
            description: "The engine episodes in this language are voiced with now.",
          }
        source: { type: [string, "null"], enum: [newsroom, default, null] }
        reason: { type: [string, "null"], description: "Why no engine can voice this language." }
        options:
          type: array
          description: Enabled engines that speak this language.
          items: { type: string }
    NewsroomTts:
      type: object
      additionalProperties: false
      required: [default, languages]
      properties:
        default: { type: string }
        languages:
          type: array
          items: { $ref: "#/components/schemas/NewsroomTtsLanguage" }
    NewsroomTtsRequest:
      type: object
      additionalProperties: false
      required: [language, engine]
      properties:
        language: { $ref: "#/components/schemas/Language" }
        engine: { type: [string, "null"], description: "Null clears the choice." }
    ChallengeRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          {
            type: string,
            minLength: 20,
            maxLength: 4000,
            description: "What the piece gets wrong.",
          }
        source_url:
          type: string
          pattern: "^https?://"
          maxLength: 500
          description: Where the reader found the correct information, if anywhere.
    ChallengeReceipt:
      type: object
      additionalProperties: false
      required: [id, token, acknowledge_by, answer_by]
      properties:
        id: { type: string, format: uuid }
        token:
          {
            type: string,
            description: "Opens the reader's status page; shown once, stored as its hash.",
          }
        acknowledge_by: { type: string, format: date-time }
        answer_by: { type: string, format: date-time }
    Challenge:
      type: object
      additionalProperties: false
      required:
        [
          id,
          publication,
          title,
          language,
          path,
          reader_text,
          source_url,
          owner,
          created_at,
          acknowledge_by,
          answer_by,
          acknowledged_at,
          answered_at,
          outcome,
          overdue,
          issue_url,
        ]
      properties:
        id: { type: string, format: uuid }
        publication: { type: string, format: uuid }
        title: { type: [string, "null"] }
        language: { $ref: "#/components/schemas/Language" }
        path: { type: [string, "null"] }
        reader_text: { type: string }
        source_url: { type: [string, "null"] }
        owner:
          {
            type: string,
            description: "The newsroom's corrections owner when the challenge came in.",
          }
        created_at: { type: string, format: date-time }
        acknowledge_by: { type: string, format: date-time }
        answer_by: { type: string, format: date-time }
        acknowledged_at: { type: [string, "null"], format: date-time }
        acknowledgement: { type: [string, "null"] }
        answered_at: { type: [string, "null"], format: date-time }
        answer: { type: [string, "null"] }
        outcome: { type: [string, "null"], enum: [upheld, rejected, null] }
        overdue: { type: boolean, description: "A deadline passed before its step was done." }
        issue_url: { type: [string, "null"] }
        filed_at: { type: [string, "null"], format: date-time }
    ChallengeDetail:
      allOf:
        - $ref: "#/components/schemas/Challenge"
        - type: object
          required: [claims, affected, corrections, lesson]
          properties:
            lesson:
              type: [string, "null"]
              description: What the gate should have caught, from the correction's check; null until upheld.
            claims:
              type: array
              description: The challenged story's claims; an upheld challenge names the one that was wrong.
              items:
                type: object
                additionalProperties: false
                required: [ref, kind, text, languages]
                properties:
                  ref: { type: string }
                  kind: { type: string, enum: [fact, quote, opinion] }
                  text: { type: string }
                  languages:
                    type: array
                    description: The languages a correction of this claim needs a notice in.
                    items: { $ref: "#/components/schemas/Language" }
            affected:
              type: array
              description: >-
                Published publications a correction covers: every language of the story, and episodes whose
                stories copied its claims (D107).
              items:
                type: object
                additionalProperties: false
                required: [id, title, language, path]
                properties:
                  id: { type: string, format: uuid }
                  title: { type: [string, "null"] }
                  language: { $ref: "#/components/schemas/Language" }
                  path: { type: [string, "null"] }
            corrections:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [publication, language, notice, published_at]
                properties:
                  publication: { type: string, format: uuid }
                  language: { $ref: "#/components/schemas/Language" }
                  notice: { type: string }
                  published_at: { type: [string, "null"], format: date-time }
    AcknowledgeRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          {
            type: string,
            maxLength: 2000,
            description: "Shown to the reader on their status page.",
          }
    RejectRequest:
      type: object
      additionalProperties: false
      required: [answer]
      properties:
        answer:
          {
            type: string,
            minLength: 1,
            maxLength: 4000,
            description: "Why the piece stands; the reader sees it.",
          }
    UpholdRequest:
      type: object
      additionalProperties: false
      required: [answer, claim, lesson, notices]
      properties:
        answer: { type: string, minLength: 1, maxLength: 4000, description: "The reader sees it." }
        claim:
          {
            type: string,
            pattern: "^c[0-9]+$",
            description: "The ref of the claim that was wrong.",
          }
        lesson:
          type: string
          minLength: 1
          maxLength: 2000
          description: What the gate should have caught; stored on the correction's check and filed as an issue.
        notices:
          type: object
          description: The published correction notice per language; one for each language of `affected`.
          additionalProperties: { type: string, minLength: 1, maxLength: 2000 }
    MediaAddRequest:
      type: object
      additionalProperties: false
      required: [url, lead_id]
      properties:
        url:
          {
            type: string,
            format: uri,
            maxLength: 2048,
            description: "A Wikimedia Commons file page, or an image from a press kit.",
          }
        source_url:
          {
            type: string,
            format: uri,
            maxLength: 2048,
            description: "The press kit's page; required unless url is a Commons file page.",
          }
        lead_id:
          {
            type: string,
            format: uuid,
            description: "The lead the image goes with; agents see a lead's licensed images.",
          }
    PressKitRequest:
      type: object
      additionalProperties: false
      required: [licence, terms_url]
      properties:
        licence:
          {
            type: string,
            minLength: 1,
            maxLength: 200,
            description: "The kit's words for the use it allows.",
          }
        terms_url: { type: string, format: uri, maxLength: 2048 }
        credit:
          {
            type: string,
            maxLength: 200,
            description: "Needed when the image's own metadata carries none.",
          }
    MediaItem:
      type: object
      required: [id, source_url, file_url, licence, licence_kind, credit_line, created_at]
      properties:
        id: { type: string, format: uuid }
        source_url: { type: string }
        file_url: { type: string }
        lead_id: { type: [string, "null"], format: uuid }
        lead_headline: { type: [string, "null"] }
        description: { type: [string, "null"] }
        creator: { type: [string, "null"] }
        credit_line: { type: [string, "null"] }
        copyright_notice: { type: [string, "null"] }
        web_statement: { type: [string, "null"] }
        licensor: { type: [string, "null"] }
        digital_source_type: { type: [string, "null"] }
        licence: { type: [string, "null"] }
        licence_kind: { type: [string, "null"], enum: [press-kit, commons, null] }
        licence_url: { type: [string, "null"] }
        licence_recorded_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
