openapi: 3.1.0
info:
  title: ANR API
  version: 0.0.0
  description: >-
    Reads and writes for people at the editor's desk (reader sites read Postgres directly). Contract-first:
    change this file, run `pnpm gen`, then implement. Agents never call this API.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
security: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check
      tags: [ops]
      responses:
        "200":
          description: The API process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /desk/me:
    get:
      operationId: getDeskMe
      summary: The signed-in person and the newsrooms they belong to
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: The person and their memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeskMe"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /desk/newsrooms/{newsroom}/queue:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: getReviewQueue
      summary: Publications held for an editor, with the reasons they are held
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: The review queue, oldest slot first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/newsrooms/{newsroom}/publications/{publication}:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Publication"
    get:
      operationId: getDeskPublication
      summary: One publication with its text, claims, checks and posts
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: The publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeskPublication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /desk/newsrooms/{newsroom}/publications/{publication}/approve:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Publication"
    post:
      operationId: approvePublication
      summary: Approve a held publication; it goes out at its slot, or at once if that has passed
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: Scheduled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/publications/{publication}/return:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Publication"
    post:
      operationId: returnPublication
      summary: Return a held publication's assignment to the desk for a new draft
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnRequest"
      responses:
        "200":
          description: Back with the desk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/posts/{post}/resolve:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - name: post
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: resolvePost
      summary: Say whether a post with an unknown result went out
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolvePostRequest"
      responses:
        "200":
          description: Resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/channels:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: listChannels
      summary: The newsroom's channels; credentials are never returned
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: Channels.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: addChannel
      summary: Add a channel (Editor-in-Chief); its credentials are sealed with the platform key
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewChannel"
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/newsrooms/{newsroom}/channels/{channel}/status:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - name: channel
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: setChannelStatus
      summary: Turn a channel on or off (Editor-in-Chief)
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelStatusRequest"
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /desk/newsrooms/{newsroom}/samples:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: listSamples
      summary: Auto-published publications sampled for review, unreviewed first
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: Samples.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sample"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/newsrooms/{newsroom}/samples/{sample}/review:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - name: sample
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: reviewSample
      summary: Record a sampled publication as fine, or as a miss the gate should have caught
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SampleReviewRequest"
      responses:
        "200":
          description: Reviewed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/notices:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: listNotices
      summary: Messages from code to the Editor-in-Chief, unread first
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: Notices.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/newsrooms/{newsroom}/notices/{notice}/read:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - name: notice
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: readNotice
      summary: Mark a notice read
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: Marked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
tags:
  - name: ops
    description: Operational endpoints.
  - name: desk
    description: >-
      The editor's desk, behind Cloudflare Access. Every request carries the Access JWT; the API
      verifies it, maps its email to a user and checks a membership in the newsroom named in the
      path. Every approval and edit is written to the audit log.
components:
  securitySchemes:
    cfAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: The Cloudflare Access JWT, verified against the team's signing keys and audience.
  parameters:
    Newsroom:
      name: newsroom
      in: path
      required: true
      description: The newsroom's slug.
      schema: { type: string, pattern: "^[a-z][a-z0-9-]*$" }
    Publication:
      name: publication
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: The request body is not valid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No valid Cloudflare Access JWT, or no user for its email.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: No membership in this newsroom, or a role that cannot do this.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Nothing with that id in this newsroom.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The row is not in a state that allows this.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: api
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
    StatusResult:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
    Language:
      type: string
      enum: [fa, en, tr]
    Role:
      type: string
      enum: [editor-in-chief, editor]
    DeskMe:
      type: object
      additionalProperties: false
      required: [email, memberships]
      properties:
        email: { type: string }
        memberships:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [newsroom, name, role]
            properties:
              newsroom: { type: string, description: The newsroom's slug. }
              name:
                type: object
                additionalProperties: { type: string }
              role: { $ref: "#/components/schemas/Role" }
    Check:
      type: object
      additionalProperties: false
      required: [id, kind, name, result, at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [code, fact-check, item-match, policy] }
        name: { type: string }
        result: { type: string, enum: [pass, fail, partial, error, timed-out] }
        claim: { type: [string, "null"], description: "The claim's ref, such as c1, if any." }
        item: { type: [string, "null"] }
        detail: {}
        at: { type: string, format: date-time }
    QueueItem:
      type: object
      additionalProperties: false
      required: [id, series, slot, language, title, holds, unknown_posts]
      properties:
        id: { type: string, format: uuid }
        series: { type: string }
        slot: { type: string, format: date-time }
        language: { $ref: "#/components/schemas/Language" }
        title: { type: [string, "null"] }
        holds:
          type: array
          description: Every check that did not pass, oldest first.
          items: { $ref: "#/components/schemas/Check" }
        unknown_posts: { type: integer, minimum: 0 }
    Post:
      type: object
      additionalProperties: false
      required: [id, channel, kind, part, status, body]
      properties:
        id: { type: string, format: uuid }
        channel: { type: string, format: uuid }
        kind: { type: string }
        part: { type: integer, minimum: 1 }
        status: { type: string, enum: [pending, sent, unknown, failed] }
        external_id: { type: [string, "null"] }
        body: { type: string }
        error: {}
        sent_at: { type: [string, "null"], format: date-time }
    Claim:
      type: object
      additionalProperties: false
      required: [ref, kind, text]
      properties:
        ref: { type: string }
        kind: { type: string, enum: [fact, quote, opinion] }
        text: { type: string }
        lead: { type: [string, "null"], description: The cited lead's URL. }
        quoted_passage: { type: [string, "null"] }
    DeskPublication:
      type: object
      additionalProperties: false
      required: [id, series, slot, language, status, rendition, claims, checks, posts]
      properties:
        id: { type: string, format: uuid }
        series: { type: string }
        slot: { type: string, format: date-time }
        language: { $ref: "#/components/schemas/Language" }
        status: { type: string }
        rendition:
          type: [object, "null"]
          description: The rendition body as the desk or renderer submitted it.
        claims:
          type: array
          items: { $ref: "#/components/schemas/Claim" }
        checks:
          type: array
          items: { $ref: "#/components/schemas/Check" }
        posts:
          type: array
          items: { $ref: "#/components/schemas/Post" }
    ReturnRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 2000
          description: What the desk should change; kept in the audit log.
    ResolvePostRequest:
      type: object
      additionalProperties: false
      required: [went_out]
      properties:
        went_out:
          type: boolean
          description: True if the message is on the channel (it is recorded as sent); false to send it again.
        external_id:
          type: string
          maxLength: 200
          description: The channel's id for the message, when it went out and is known.
    Channel:
      type: object
      additionalProperties: false
      required: [id, kind, language, status, has_credentials]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [site, telegram, podcast-rss] }
        language: { $ref: "#/components/schemas/Language" }
        external_id: { type: [string, "null"] }
        status: { type: string, enum: [active, disabled] }
        has_credentials: { type: boolean }
    NewChannel:
      type: object
      additionalProperties: false
      required: [kind, language]
      properties:
        kind: { type: string, enum: [site, telegram, podcast-rss] }
        language: { $ref: "#/components/schemas/Language" }
        external_id:
          type: string
          maxLength: 200
          description: The channel's own id, such as a Telegram chat id or @username.
        credentials:
          type: object
          additionalProperties: { type: string, maxLength: 500 }
          description: Secrets such as `bot_token`; sealed before they reach Postgres, never returned.
    ChannelStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [active, disabled] }
    Sample:
      type: object
      additionalProperties: false
      required: [id, publication, title, language, sampled_at]
      properties:
        id: { type: string, format: uuid }
        publication: { type: string, format: uuid }
        title: { type: [string, "null"] }
        language: { $ref: "#/components/schemas/Language" }
        sampled_at: { type: string, format: date-time }
        outcome: { type: [string, "null"], enum: [ok, miss, null] }
        note: { type: [string, "null"] }
        reviewed_at: { type: [string, "null"], format: date-time }
    SampleReviewRequest:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome: { type: string, enum: [ok, miss] }
        note:
          type: string
          maxLength: 2000
          description: What the gate should have caught, to become a new check or policy rule; required for a miss.
    Notice:
      type: object
      additionalProperties: false
      required: [id, kind, key, detail, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [budget-warning, budget-cap, no-leads, no-channel] }
        key: { type: string }
        detail: {}
        created_at: { type: string, format: date-time }
        read_at: { type: [string, "null"], format: date-time }
