openapi: 3.1.0
info:
  title: ANR API
  version: 0.0.0
  description: >-
    Reads and writes for people at the editor's desk (reader sites read Postgres directly). Contract-first:
    change this file, run `pnpm gen`, then implement. Agents never call this API.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
security: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness check
      tags: [ops]
      responses:
        "200":
          description: The API process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /desk/me:
    get:
      operationId: getDeskMe
      summary: The signed-in person and the newsrooms they belong to
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: The person and their memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeskMe"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /desk/newsrooms/{newsroom}/queue:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: getReviewQueue
      summary: Publications held for an editor, with the reasons they are held
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: The review queue, oldest slot first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/newsrooms/{newsroom}/publications/{publication}:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Publication"
    get:
      operationId: getDeskPublication
      summary: One publication with its text, claims, checks and posts
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: The publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeskPublication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /desk/newsrooms/{newsroom}/publications/{publication}/approve:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Publication"
    post:
      operationId: approvePublication
      summary: Approve a held publication; it goes out at its slot, or at once if that has passed
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequest"
      responses:
        "200":
          description: Scheduled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/publications/{publication}/return:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Publication"
    post:
      operationId: returnPublication
      summary: Return a held publication's assignment to the desk for a new draft
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnRequest"
      responses:
        "200":
          description: Back with the desk.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/posts/{post}/resolve:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - name: post
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: resolvePost
      summary: Say whether a post with an unknown result went out
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolvePostRequest"
      responses:
        "200":
          description: Resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/channels:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: listChannels
      summary: The newsroom's channels; credentials are never returned
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: Channels.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Channel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: addChannel
      summary: Add a channel (Editor-in-Chief); its credentials are sealed with the platform key
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewChannel"
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/newsrooms/{newsroom}/channels/{channel}/status:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - name: channel
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: setChannelStatus
      summary: Turn a channel on or off (Editor-in-Chief)
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelStatusRequest"
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /desk/newsrooms/{newsroom}/samples:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: listSamples
      summary: Auto-published publications sampled for review, unreviewed first
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: Samples.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sample"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/newsrooms/{newsroom}/samples/{sample}/review:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - name: sample
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: reviewSample
      summary: Record a sampled publication as fine, or as a miss the gate should have caught
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SampleReviewRequest"
      responses:
        "200":
          description: Reviewed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/notices:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: listNotices
      summary: Messages from code to the Editor-in-Chief, unread first
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: Notices.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/newsrooms/{newsroom}/notices/{notice}/read:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - name: notice
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: readNotice
      summary: Mark a notice read
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: Marked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /desk/newsrooms/{newsroom}/publications/{publication}/preview:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Publication"
    get:
      operationId: previewPublication
      summary: What would be sent now - every channel's parts and the site page - from the same renderer and context as the publisher
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /desk/newsrooms/{newsroom}/publications/{publication}/edit:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Publication"
    post:
      operationId: editPublication
      summary: Change text of a held publication; its label then says a person edited it
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditRequest"
      responses:
        "200":
          description: Edited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/publications/{publication}/pull-back:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Publication"
    post:
      operationId: pullBackPublication
      summary: Hold a scheduled publication before its slot; it returns to the review queue
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PullBackRequest"
      responses:
        "200":
          description: Held.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/schedule:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: getSchedule
      summary: Publications whose slot is in the next days, in any status before published
      tags: [desk]
      security: [{ cfAccess: [] }]
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 31, default: 7 }
      responses:
        "200":
          description: Upcoming slots, soonest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/newsrooms/{newsroom}/channels/{channel}/credentials:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - name: channel
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: replaceChannelCredentials
      summary: Replace a channel's credentials (Editor-in-Chief); sealed, never returned, then checked
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /desk/newsrooms/{newsroom}/channels/{channel}/check:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - name: channel
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: checkChannel
      summary: Ask the publisher whether the channel can be posted to (Editor-in-Chief); nothing is sent
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: Queued; the result appears on the channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /desk/newsrooms/{newsroom}/samples/{sample}/issue:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - name: sample
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: fileSampleIssue
      summary: Record the issue a sample miss was filed as
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueRequest"
      responses:
        "200":
          description: Filed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/budget:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: getBudget
      summary: This month's model spend against the newsroom's budget
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: The budget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/newsrooms/{newsroom}/sources:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: listSourceHealth
      summary: Each source's last fetch, failures and recent leads
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: Sources, failing first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceHealth"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/newsrooms/{newsroom}/measures:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: getMeasures
      summary: The charter's measures, week by week
      tags: [desk]
      security: [{ cfAccess: [] }]
      parameters:
        - name: weeks
          in: query
          schema: { type: integer, minimum: 1, maximum: 26, default: 8 }
      responses:
        "200":
          description: The measures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Measures"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/newsrooms/{newsroom}/plan:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: getPlan
      summary: The planner's theme proposals and weekly picks, current and coming
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: Themes of the current and next cycle, and picks from the last four weeks on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/newsrooms/{newsroom}/cycles/{cycle}/approve:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - name: cycle
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: approveTheme
      summary: Approve one proposed theme, as edited, for its cycle; the cycle's other proposals are declined
      description: Editor-in-Chief only (D105). Every changed field is audited.
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveThemeRequest"
      responses:
        "200":
          description: Approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/picks/{pick}/choose:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - name: pick
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: choosePick
      summary: Choose one of a weekly pick's three candidates before its deadline
      description: Editor-in-Chief only (D105). Queues the assignment for the pick's slot; refused once the deadline has passed (D104).
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChoosePickRequest"
      responses:
        "200":
          description: Chosen; the desk will research it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/admin/tts:
    get:
      operationId: getAdminTts
      summary: The text-to-speech engines in the models file, and which are enabled for newsrooms
      description: Platform admin only (D113).
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTts"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: setAdminTts
      summary: Enable a set of engines for every newsroom to choose from
      description: Platform admin only; audited in the platform audit log (D113).
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTtsRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/admin/ops:
    get:
      operationId: getOps
      summary: Publishing pauses, queues, failed and waiting jobs, backups and heartbeats
      description: Platform admin only (D144). Grafana shows history; this page acts.
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: The platform's state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/admin/ops/pause:
    post:
      operationId: pauseOps
      summary: Pause publishing in one newsroom, or in every newsroom without one
      description: Platform admin only; audited in the platform audit log. The publisher stops before its next send or part (D144).
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpsPauseRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsDone"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /desk/admin/ops/resume:
    post:
      operationId: resumeOps
      summary: Resume publishing in one newsroom, or everywhere
      description: Platform admin only; audited. A scheduled publication now past its slot by more than its format's grace is held as a missed slot; the rest send (D129, D144).
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpsPauseRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsResumed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /desk/admin/ops/drain:
    post:
      operationId: drainOpsQueue
      summary: Drain a queue, or lift its drain
      description: Platform admin only; audited. Workers take no new job from a drained queue within 30 seconds; running ones finish and nothing is deleted. Only queues whose work ends in a hold or is done again (D144).
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpsDrainRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsDone"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/admin/ops/jobs/retry:
    post:
      operationId: retryOpsJob
      summary: Retry a failed job
      description: Platform admin only; audited. A part recorded as unknown is still never re-sent (D89).
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpsJobRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsDone"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/admin/ops/jobs/cancel:
    post:
      operationId: cancelOpsJob
      summary: Cancel a job that has not started
      description: Platform admin only; audited. Refused for the deadline queues, publish-correction, assign, redraft and publish-sweep (D144).
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpsJobRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsDone"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/admin/ops/backup-check:
    post:
      operationId: requestBackupCheck
      summary: Ask the host for a backup check now
      description: Platform admin only; audited. The host's job runs it within 30 seconds and records it in backup_runs (D131, D144).
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpsRequested"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/newsrooms/{newsroom}/tts:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: getNewsroomTts
      summary: The newsroom's TTS engine per language, and what each language would use now
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: One row per newsroom language.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsroomTts"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: setNewsroomTts
      summary: Choose the engine for one language, or clear the choice to use the default
      description: Editor-in-Chief only; audited (D113).
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsroomTtsRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /reader/newsrooms/{newsroom}/publications/{publication}/challenges:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Publication"
    post:
      operationId: submitChallenge
      summary: A reader challenges a published piece (D114)
      description: >-
        Public: called by the newsroom's site for its reader form. Nothing about the reader is stored; the
        rate limit keys on an HMAC of the reader's network (CF-Connecting-IP, an IPv6 /64; never X-Forwarded-For)
        under a random secret dropped after the day. The receipt's token opens the reader's status page
        and is stored only as its hash.
      tags: [reader]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeRequest"
      responses:
        "201":
          description: Received; owned by the newsroom's corrections owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /desk/newsrooms/{newsroom}/challenges:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: listChallenges
      summary: Readers' challenges, open ones first, with their deadlines
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: Challenges.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Challenge"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /desk/newsrooms/{newsroom}/challenges/{challenge}:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Challenge"
    get:
      operationId: getChallenge
      summary: One challenge, with the story's claims and every publication a correction would cover
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: The challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /desk/newsrooms/{newsroom}/challenges/{challenge}/acknowledge:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Challenge"
    post:
      operationId: acknowledgeChallenge
      summary: Acknowledge a challenge, with an optional note the reader sees
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcknowledgeRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/challenges/{challenge}/reject:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Challenge"
    post:
      operationId: rejectChallenge
      summary: Answer a challenge without a correction; the reader sees the answer
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/challenges/{challenge}/uphold:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Challenge"
    post:
      operationId: upholdChallenge
      summary: Uphold a challenge, correcting every affected publication and checking the corrected claim (D115, D116)
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpholdRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/challenges/{challenge}/issue:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Challenge"
    post:
      operationId: fileChallengeIssue
      summary: Record the issue an upheld challenge's lesson was filed as
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /desk/newsrooms/{newsroom}/media:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
    get:
      operationId: listMedia
      summary: The newsroom's images, unlicensed first
      tags: [desk]
      security: [{ cfAccess: [] }]
      responses:
        "200":
          description: Up to 200 media items.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MediaItem" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: addMedia
      summary: Add an image by URL; ingestion fetches it and reads its Photo Metadata
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaAddRequest"
      responses:
        "202":
          description: Queued. The item appears once read, or a media-failed notice.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [queued]
                properties:
                  queued: { type: boolean }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /desk/newsrooms/{newsroom}/media/{media}/licence:
    parameters:
      - $ref: "#/components/parameters/Newsroom"
      - $ref: "#/components/parameters/Media"
    post:
      operationId: recordPressKit
      summary: Record that a press kit allows press use, with the credit
      tags: [desk]
      security: [{ cfAccess: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PressKitRequest"
      responses:
        "200":
          description: Recorded; it can no longer change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
tags:
  - name: ops
    description: Operational endpoints.
  - name: desk
    description: >-
      The editor's desk, behind Cloudflare Access. Every request carries the Access JWT; the API
      verifies it, maps its email to a user and checks a membership in the newsroom named in the
      path. Every approval and edit is written to the audit log.
  - name: reader
    description: >-
      Public writes from a newsroom's site on a reader's behalf: no sign-in, nothing stored about the
      reader, rate-limited.
components:
  securitySchemes:
    cfAccess:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: The Cloudflare Access JWT, verified against the team's signing keys and audience.
  parameters:
    Newsroom:
      name: newsroom
      in: path
      required: true
      description: The newsroom's slug.
      schema: { type: string, pattern: "^[a-z][a-z0-9-]*$" }
    Publication:
      name: publication
      in: path
      required: true
      schema: { type: string, format: uuid }
    Challenge:
      name: challenge
      in: path
      required: true
      schema: { type: string, format: uuid }
    Media:
      name: media
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: The request body is not valid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No valid Cloudflare Access JWT, or no user for its email.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: No membership in this newsroom, or a role that cannot do this.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Nothing with that id in this newsroom.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The row is not in a state that allows this.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Too many challenges from this reader, or to this piece, today.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: api
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
    OpsDone:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok: { type: boolean }
    OpsPauseRequest:
      type: object
      additionalProperties: false
      properties:
        newsroom: { type: string, description: "A newsroom's slug; without one, every newsroom." }
    OpsResumed:
      type: object
      additionalProperties: false
      required: [held]
      properties:
        held:
          type: array
          description: Publications held as missed slots on resuming.
          items: { type: string, format: uuid }
    OpsDrainRequest:
      type: object
      additionalProperties: false
      required: [queue, drained]
      properties:
        queue: { type: string }
        drained: { type: boolean }
    OpsJobRequest:
      type: object
      additionalProperties: false
      required: [queue, id]
      properties:
        queue: { type: string }
        id: { type: string, format: uuid }
    OpsRequested:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id: { type: string, format: uuid }
    OpsJob:
      type: object
      additionalProperties: false
      required: [id, queue, newsroom, at]
      properties:
        id: { type: string, format: uuid }
        queue: { type: string }
        newsroom: { type: [string, "null"] }
        at: { type: string, format: date-time }
        error: { type: [string, "null"] }
    OpsState:
      type: object
      additionalProperties: false
      required:
        [
          paused_everywhere,
          pauses,
          queues,
          failed,
          waiting,
          backups,
          backup_requests,
          heartbeats,
          outages,
        ]
      properties:
        paused_everywhere: { type: boolean }
        pauses:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [newsroom, paused_at]
            properties:
              newsroom: { type: string }
              paused_at: { type: [string, "null"], format: date-time }
        queues:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, drainable, drained_at, waiting, active, failed]
            properties:
              name: { type: string }
              drainable: { type: boolean }
              drained_at: { type: [string, "null"], format: date-time }
              waiting: { type: integer }
              active: { type: integer }
              failed: { type: integer }
        failed: { type: array, items: { $ref: "#/components/schemas/OpsJob" } }
        waiting: { type: array, items: { $ref: "#/components/schemas/OpsJob" } }
        backups:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, started_at, finished_at, ok]
            properties:
              kind: { type: string, enum: [init, full, diff, incr, check] }
              started_at: { type: string, format: date-time }
              finished_at: { type: [string, "null"], format: date-time }
              ok: { type: [boolean, "null"] }
        backup_requests:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, requested_at, picked_at, done_at]
            properties:
              id: { type: string, format: uuid }
              requested_at: { type: string, format: date-time }
              picked_at: { type: [string, "null"], format: date-time }
              done_at: { type: [string, "null"], format: date-time }
        heartbeats:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [worker, beat_at, late]
            properties:
              worker: { type: string }
              beat_at: { type: string, format: date-time }
              late: { type: boolean }
        outages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, worker, started_at, ended_at]
            properties:
              kind: { type: string, enum: [worker, host] }
              worker: { type: [string, "null"] }
              started_at: { type: string, format: date-time }
              ended_at: { type: string, format: date-time }
    StatusResult:
      type: object
      additionalProperties: false
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
    Language:
      type: string
      enum: [fa, en, tr]
    Role:
      type: string
      enum: [editor-in-chief, editor]
    DeskMe:
      type: object
      additionalProperties: false
      required: [email, platform_admin, memberships]
      properties:
        email: { type: string }
        platform_admin:
          type: boolean
          description: The platform's one super admin, who chooses the TTS engines on offer (D113).
        memberships:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [newsroom, name, role]
            properties:
              newsroom: { type: string, description: The newsroom's slug. }
              name:
                type: object
                additionalProperties: { type: string }
              role: { $ref: "#/components/schemas/Role" }
    Check:
      type: object
      additionalProperties: false
      required: [id, kind, name, result, at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [code, fact-check, item-match, policy] }
        name: { type: string }
        result: { type: string, enum: [pass, fail, partial, error, timed-out] }
        claim: { type: [string, "null"], description: "The claim's ref, such as c1, if any." }
        item: { type: [string, "null"] }
        detail: {}
        at: { type: string, format: date-time }
    QueueItem:
      type: object
      additionalProperties: false
      required: [id, series, slot, language, title, holds, unknown_posts]
      properties:
        id: { type: string, format: uuid }
        series: { type: string }
        slot: { type: string, format: date-time }
        language: { $ref: "#/components/schemas/Language" }
        title: { type: [string, "null"] }
        holds:
          type: array
          description: Every check that did not pass, oldest first.
          items: { $ref: "#/components/schemas/Check" }
        unknown_posts: { type: integer, minimum: 0 }
    Post:
      type: object
      additionalProperties: false
      required: [id, channel, kind, part, status, body]
      properties:
        id: { type: string, format: uuid }
        channel: { type: string, format: uuid }
        kind: { type: string }
        part: { type: integer, minimum: 1 }
        status: { type: string, enum: [pending, sent, unknown, failed] }
        external_id: { type: [string, "null"] }
        body: { type: string }
        error: {}
        sent_at: { type: [string, "null"], format: date-time }
    Claim:
      type: object
      additionalProperties: false
      required: [ref, kind, text]
      properties:
        ref: { type: string }
        kind: { type: string, enum: [fact, quote, opinion] }
        text: { type: string }
        lead: { type: [string, "null"], description: The cited lead's URL. }
        quoted_passage: { type: [string, "null"] }
    DeskPublication:
      type: object
      additionalProperties: false
      required:
        [
          id,
          series,
          slot,
          language,
          status,
          version,
          editable,
          rendition,
          claims,
          checks,
          posts,
          runs,
          cost_usd,
        ]
      properties:
        id: { type: string, format: uuid }
        series: { type: string }
        slot: { type: string, format: date-time }
        language: { $ref: "#/components/schemas/Language" }
        status: { type: string }
        version:
          type: string
          description: Changes whenever the publication does; approve and edit send it back and are refused if it moved.
        editable:
          type: boolean
          description: Held, with text, and no part sent or in flight.
        rendition:
          type: [object, "null"]
          description: The rendition body as the desk or renderer submitted it.
        claims:
          type: array
          items: { $ref: "#/components/schemas/Claim" }
        checks:
          type: array
          items: { $ref: "#/components/schemas/Check" }
        posts:
          type: array
          items: { $ref: "#/components/schemas/Post" }
        runs:
          type: array
          description: The agent runs behind the publication's assignment and stories.
          items: { $ref: "#/components/schemas/AgentRun" }
        cost_usd: { type: number, description: The runs' summed cost. }
    ApproveRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: string, maxLength: 100, description: The version the editor saw. }
    ReturnRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 2000
          description: What the desk should change; kept in the audit log.
    ResolvePostRequest:
      type: object
      additionalProperties: false
      required: [went_out]
      properties:
        went_out:
          type: boolean
          description: True if the message is on the channel (it is recorded as sent); false to send it again.
        external_id:
          type: string
          maxLength: 200
          description: The channel's id for the message, when it went out and is known.
    Channel:
      type: object
      additionalProperties: false
      required: [id, kind, language, status, has_credentials]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [site, telegram, podcast-rss] }
        language: { $ref: "#/components/schemas/Language" }
        external_id: { type: [string, "null"] }
        status: { type: string, enum: [active, disabled] }
        has_credentials: { type: boolean }
        checked_at: { type: [string, "null"], format: date-time }
        check_result:
          description: What the channel said at its last check, null before one.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ChannelCheck"
    NewChannel:
      type: object
      additionalProperties: false
      required: [kind, language]
      properties:
        kind: { type: string, enum: [site, telegram, podcast-rss] }
        language: { $ref: "#/components/schemas/Language" }
        external_id:
          type: string
          maxLength: 200
          description: The channel's own id, such as a Telegram chat id or @username.
        credentials:
          type: object
          additionalProperties: { type: string, maxLength: 500 }
          description: Secrets such as `bot_token`; sealed before they reach Postgres, never returned.
    ChannelStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [active, disabled] }
    Sample:
      type: object
      additionalProperties: false
      required: [id, publication, title, language, sampled_at]
      properties:
        id: { type: string, format: uuid }
        publication: { type: string, format: uuid }
        title: { type: [string, "null"] }
        language: { $ref: "#/components/schemas/Language" }
        sampled_at: { type: string, format: date-time }
        outcome: { type: [string, "null"], enum: [ok, miss, null] }
        note: { type: [string, "null"] }
        reviewed_at: { type: [string, "null"], format: date-time }
        issue_url: { type: [string, "null"] }
        filed_at: { type: [string, "null"], format: date-time }
    SampleReviewRequest:
      type: object
      additionalProperties: false
      required: [outcome]
      properties:
        outcome: { type: string, enum: [ok, miss] }
        note:
          type: string
          maxLength: 2000
          description: What the gate should have caught, to become a new check or policy rule; required for a miss.
    Notice:
      type: object
      additionalProperties: false
      required: [id, kind, key, detail, created_at]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum:
            [
              budget-warning,
              budget-cap,
              no-leads,
              no-channel,
              no-theme,
              pick-missed,
              plan-failed,
              challenge-due,
              challenge-overdue,
              media-failed,
              slot-missed,
            ]
        key: { type: string }
        detail: {}
        created_at: { type: string, format: date-time }
        read_at: { type: [string, "null"], format: date-time }
    AgentRun:
      type: object
      additionalProperties: false
      required: [id, role, provider, model, outcome, cost_usd, started_at]
      properties:
        id: { type: string, format: uuid }
        role: { type: string }
        provider: { type: string }
        model: { type: string }
        outcome: { type: [string, "null"] }
        cost_usd: { type: [number, "null"] }
        tokens_in: { type: [integer, "null"] }
        tokens_out: { type: [integer, "null"] }
        started_at: { type: string, format: date-time }
    Preview:
      type: object
      additionalProperties: false
      required: [label, edited, site, channels]
      properties:
        label: { type: string, description: The disclosure label every part must carry. }
        edited: { type: boolean }
        site:
          type: object
          additionalProperties: false
          required: [url, html]
          properties:
            url: { type: string }
            html:
              {
                type: string,
                description: "The site template's output, as the page body shows it.",
              }
            error: { type: string, description: Why the site page cannot be rendered. }
        channels:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, configured, parts]
            properties:
              kind: { type: string }
              configured:
                {
                  type: boolean,
                  description: Whether the newsroom has an active channel of this kind and language.,
                }
              parts: { type: array, items: { type: string } }
              error:
                {
                  type: string,
                  description: Why it cannot be rendered; the publisher would hold it.,
                }
    EditRequest:
      type: object
      additionalProperties: false
      required: [version, changes]
      properties:
        version: { type: string, maxLength: 100, description: The version the editor saw. }
        changes:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [pointer, text]
            properties:
              pointer:
                type: string
                description: A JSON pointer to a text field of the first rendition, such as /items/0/body.
              text: { type: string, maxLength: 20000 }
    PullBackRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note:
          {
            type: string,
            minLength: 1,
            maxLength: 2000,
            description: Why; shown in the review queue.,
          }
    ScheduleItem:
      type: object
      additionalProperties: false
      required: [id, series, slot, language, status, title]
      properties:
        id: { type: string, format: uuid }
        series: { type: string }
        slot: { type: string, format: date-time }
        language: { $ref: "#/components/schemas/Language" }
        status: { type: string, enum: [assigned, drafted, with-editor, scheduled] }
        title: { type: [string, "null"] }
    CredentialsRequest:
      type: object
      additionalProperties: false
      required: [credentials]
      properties:
        credentials:
          type: object
          additionalProperties: { type: string, maxLength: 500 }
          description: The channel's new secrets, replacing all of the old ones.
    ChannelCheck:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok: { type: boolean }
        problem: { type: string }
        detail:
          type: object
          additionalProperties: { type: [string, boolean, "null"] }
    IssueRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, pattern: "^https://", maxLength: 500 }
    Budget:
      type: object
      additionalProperties: false
      required: [month, monthly_usd, check_reserve_usd, writing_limit_usd, spent_usd, by_role, runs]
      properties:
        month: { type: string, description: "YYYY-MM in the newsroom's timezone." }
        monthly_usd: { type: number }
        check_reserve_usd: { type: number }
        writing_limit_usd:
          { type: number, description: Where writing roles stop; checks may spend the reserve. }
        spent_usd: { type: number }
        by_role:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [role, runs, cost_usd]
            properties:
              role: { type: string }
              runs: { type: integer }
              cost_usd: { type: number }
        runs:
          type: array
          description: This month's latest runs.
          items: { $ref: "#/components/schemas/AgentRun" }
    SourceHealth:
      type: object
      additionalProperties: false
      required: [id, slug, kind, url, tier, use, terms_checked, consecutive_failures, leads_7d]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        kind: { type: string }
        url: { type: string }
        publisher: { type: [string, "null"] }
        tier: { type: integer }
        use: { type: string }
        terms_checked: { type: [string, "null"], format: date }
        last_fetched_at: { type: [string, "null"], format: date-time }
        last_status: { type: [integer, "null"] }
        last_error: { type: [string, "null"] }
        consecutive_failures: { type: integer }
        leads_7d:
          { type: integer, description: Leads first seen from this source in the last 7 days. }
    MeasureWeek:
      type: object
      additionalProperties: false
      required:
        - week
        - published
        - gated
        - held
        - hold_rate
        - samples_reviewed
        - sample_misses
        - corrections
        - corrections_per_100
        - editor_minutes
        - cost_usd
        - cost_per_publication
        - page_views
        - downloads
      properties:
        week:
          {
            type: string,
            format: date,
            description: "The week's Monday, in the newsroom's timezone.",
          }
        published: { type: integer }
        gated: { type: integer, description: Publications in the week's slots that left the gate. }
        held: { type: integer }
        hold_rate: { type: [number, "null"] }
        samples_reviewed: { type: integer }
        sample_misses: { type: integer }
        corrections: { type: integer }
        corrections_per_100: { type: [number, "null"] }
        editor_minutes: { type: number }
        cost_usd: { type: number }
        cost_per_publication: { type: [number, "null"] }
        page_views:
          type: object
          additionalProperties: { type: integer }
          description: By language.
        downloads:
          type: object
          additionalProperties: { type: integer }
          description: By language.
    Measures:
      type: object
      additionalProperties: false
      required: [weeks, subscribers]
      properties:
        weeks:
          type: array
          description: Newest week first.
          items: { $ref: "#/components/schemas/MeasureWeek" }
        subscribers:
          type: array
          description: Each active Telegram channel's latest subscriber count.
          items:
            type: object
            additionalProperties: false
            required: [channel, language, subscribers, day]
            properties:
              channel: { type: string, format: uuid }
              language: { $ref: "#/components/schemas/Language" }
              external_id: { type: [string, "null"] }
              subscribers: { type: integer }
              day: { type: string, format: date }

    PlanLead:
      type: object
      additionalProperties: false
      required: [id, url, headline]
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        headline: { type: [string, "null"] }
    CalendarWeek:
      type: object
      additionalProperties: false
      required: [week, focus]
      properties:
        week: { type: string, format: date, description: "The Monday of a week the cycle touches." }
        focus: { type: string, minLength: 1, maxLength: 240 }
    ThemeProposal:
      type: object
      additionalProperties: false
      required: [id, starts, ends, theme, angle, rationale, calendar, status, decided_at, leads]
      properties:
        id: { type: string, format: uuid }
        starts: { type: string, format: date }
        ends: { type: string, format: date, description: "The day after the cycle's last day." }
        theme: { type: string }
        angle: { type: [string, "null"] }
        rationale: { type: [string, "null"] }
        calendar:
          type: array
          items: { $ref: "#/components/schemas/CalendarWeek" }
        status: { type: string, enum: [proposed, approved, declined] }
        decided_at: { type: [string, "null"], format: date-time }
        leads:
          type: array
          items: { $ref: "#/components/schemas/PlanLead" }
    PickCandidate:
      type: object
      additionalProperties: false
      required: [title, angle, why, leads]
      properties:
        title: { type: string }
        angle: { type: string }
        why: { type: string }
        leads:
          type: array
          items: { $ref: "#/components/schemas/PlanLead" }
    WeeklyPick:
      type: object
      additionalProperties: false
      required: [id, series, week, slot, deadline, chosen, picked_at, skipped_at, candidates]
      properties:
        id: { type: string, format: uuid }
        series: { type: string }
        week: { type: string, format: date }
        slot: { type: string, format: date-time }
        deadline: { type: string, format: date-time }
        chosen: { type: [integer, "null"], minimum: 0, maximum: 2 }
        picked_at: { type: [string, "null"], format: date-time }
        skipped_at: { type: [string, "null"], format: date-time }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/PickCandidate" }
    Plan:
      type: object
      additionalProperties: false
      required: [themes, picks]
      properties:
        themes:
          type: array
          description: Proposals for the current and later cycles, newest cycle first.
          items: { $ref: "#/components/schemas/ThemeProposal" }
        picks:
          type: array
          description: Picks of the last four weeks and later, newest first.
          items: { $ref: "#/components/schemas/WeeklyPick" }
    ApproveThemeRequest:
      type: object
      additionalProperties: false
      required: [theme, angle, calendar]
      properties:
        theme: { type: string, minLength: 1, maxLength: 140 }
        angle: { type: string, minLength: 1, maxLength: 800 }
        calendar:
          type: array
          description: The same weeks as proposed, each with its focus as the Editor-in-Chief wants it.
          items: { $ref: "#/components/schemas/CalendarWeek" }
    ChoosePickRequest:
      type: object
      additionalProperties: false
      required: [candidate]
      properties:
        candidate: { type: integer, minimum: 0, maximum: 2 }
    TtsEngine:
      type: object
      additionalProperties: false
      required: [id, model, languages, local, enabled]
      properties:
        id: { type: string, description: "Catalogue id in the models file." }
        model: { type: string }
        languages:
          type: array
          items: { $ref: "#/components/schemas/Language" }
        local: { type: boolean, description: "Runs on this machine (tools/tts-eval/serve.py)." }
        enabled: { type: boolean }
    AdminTts:
      type: object
      additionalProperties: false
      required: [default, engines]
      properties:
        default:
          {
            type: string,
            description: "The models file's `tts`: used where a newsroom chose none.",
          }
        engines:
          type: array
          items: { $ref: "#/components/schemas/TtsEngine" }
    AdminTtsRequest:
      type: object
      additionalProperties: false
      required: [engines]
      properties:
        engines:
          type: array
          items: { type: string }
    NewsroomTtsLanguage:
      type: object
      additionalProperties: false
      required: [language, chosen, effective, source, reason, options]
      properties:
        language: { $ref: "#/components/schemas/Language" }
        chosen: { type: [string, "null"] }
        effective:
          {
            type: [string, "null"],
            description: "The engine episodes in this language are voiced with now.",
          }
        source: { type: [string, "null"], enum: [newsroom, default, null] }
        reason: { type: [string, "null"], description: "Why no engine can voice this language." }
        options:
          type: array
          description: Enabled engines that speak this language.
          items: { type: string }
    NewsroomTts:
      type: object
      additionalProperties: false
      required: [default, languages]
      properties:
        default: { type: string }
        languages:
          type: array
          items: { $ref: "#/components/schemas/NewsroomTtsLanguage" }
    NewsroomTtsRequest:
      type: object
      additionalProperties: false
      required: [language, engine]
      properties:
        language: { $ref: "#/components/schemas/Language" }
        engine: { type: [string, "null"], description: "Null clears the choice." }
    ChallengeRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          {
            type: string,
            minLength: 20,
            maxLength: 4000,
            description: "What the piece gets wrong.",
          }
        source_url:
          type: string
          pattern: "^https?://"
          maxLength: 500
          description: Where the reader found the correct information, if anywhere.
    ChallengeReceipt:
      type: object
      additionalProperties: false
      required: [id, token, acknowledge_by, answer_by]
      properties:
        id: { type: string, format: uuid }
        token:
          {
            type: string,
            description: "Opens the reader's status page; shown once, stored as its hash.",
          }
        acknowledge_by: { type: string, format: date-time }
        answer_by: { type: string, format: date-time }
    Challenge:
      type: object
      additionalProperties: false
      required:
        [
          id,
          publication,
          title,
          language,
          path,
          reader_text,
          source_url,
          owner,
          created_at,
          acknowledge_by,
          answer_by,
          acknowledged_at,
          answered_at,
          outcome,
          overdue,
          issue_url,
        ]
      properties:
        id: { type: string, format: uuid }
        publication: { type: string, format: uuid }
        title: { type: [string, "null"] }
        language: { $ref: "#/components/schemas/Language" }
        path: { type: [string, "null"] }
        reader_text: { type: string }
        source_url: { type: [string, "null"] }
        owner:
          {
            type: string,
            description: "The newsroom's corrections owner when the challenge came in.",
          }
        created_at: { type: string, format: date-time }
        acknowledge_by: { type: string, format: date-time }
        answer_by: { type: string, format: date-time }
        acknowledged_at: { type: [string, "null"], format: date-time }
        acknowledgement: { type: [string, "null"] }
        answered_at: { type: [string, "null"], format: date-time }
        answer: { type: [string, "null"] }
        outcome: { type: [string, "null"], enum: [upheld, rejected, null] }
        overdue: { type: boolean, description: "A deadline passed before its step was done." }
        issue_url: { type: [string, "null"] }
        filed_at: { type: [string, "null"], format: date-time }
    ChallengeDetail:
      allOf:
        - $ref: "#/components/schemas/Challenge"
        - type: object
          required: [claims, affected, corrections, lesson]
          properties:
            lesson:
              type: [string, "null"]
              description: What the gate should have caught, from the correction's check; null until upheld.
            claims:
              type: array
              description: The challenged story's claims; an upheld challenge names the one that was wrong.
              items:
                type: object
                additionalProperties: false
                required: [ref, kind, text, languages]
                properties:
                  ref: { type: string }
                  kind: { type: string, enum: [fact, quote, opinion] }
                  text: { type: string }
                  languages:
                    type: array
                    description: The languages a correction of this claim needs a notice in.
                    items: { $ref: "#/components/schemas/Language" }
            affected:
              type: array
              description: >-
                Published publications a correction covers: every language of the story, and episodes whose
                stories copied its claims (D107).
              items:
                type: object
                additionalProperties: false
                required: [id, title, language, path]
                properties:
                  id: { type: string, format: uuid }
                  title: { type: [string, "null"] }
                  language: { $ref: "#/components/schemas/Language" }
                  path: { type: [string, "null"] }
            corrections:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [publication, language, notice, published_at]
                properties:
                  publication: { type: string, format: uuid }
                  language: { $ref: "#/components/schemas/Language" }
                  notice: { type: string }
                  published_at: { type: [string, "null"], format: date-time }
    AcknowledgeRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          {
            type: string,
            maxLength: 2000,
            description: "Shown to the reader on their status page.",
          }
    RejectRequest:
      type: object
      additionalProperties: false
      required: [answer]
      properties:
        answer:
          {
            type: string,
            minLength: 1,
            maxLength: 4000,
            description: "Why the piece stands; the reader sees it.",
          }
    UpholdRequest:
      type: object
      additionalProperties: false
      required: [answer, claim, lesson, notices]
      properties:
        answer: { type: string, minLength: 1, maxLength: 4000, description: "The reader sees it." }
        claim:
          {
            type: string,
            pattern: "^c[0-9]+$",
            description: "The ref of the claim that was wrong.",
          }
        lesson:
          type: string
          minLength: 1
          maxLength: 2000
          description: What the gate should have caught; stored on the correction's check and filed as an issue.
        notices:
          type: object
          description: The published correction notice per language; one for each language of `affected`.
          additionalProperties: { type: string, minLength: 1, maxLength: 2000 }
    MediaAddRequest:
      type: object
      additionalProperties: false
      required: [url, lead_id]
      properties:
        url:
          {
            type: string,
            format: uri,
            maxLength: 2048,
            description: "A Wikimedia Commons file page, or an image from a press kit.",
          }
        source_url:
          {
            type: string,
            format: uri,
            maxLength: 2048,
            description: "The press kit's page; required unless url is a Commons file page.",
          }
        lead_id:
          {
            type: string,
            format: uuid,
            description: "The lead the image goes with; agents see a lead's licensed images.",
          }
    PressKitRequest:
      type: object
      additionalProperties: false
      required: [licence, terms_url]
      properties:
        licence:
          {
            type: string,
            minLength: 1,
            maxLength: 200,
            description: "The kit's words for the use it allows.",
          }
        terms_url: { type: string, format: uri, maxLength: 2048 }
        credit:
          {
            type: string,
            maxLength: 200,
            description: "Needed when the image's own metadata carries none.",
          }
    MediaItem:
      type: object
      required: [id, source_url, file_url, licence, licence_kind, credit_line, created_at]
      properties:
        id: { type: string, format: uuid }
        source_url: { type: string }
        file_url: { type: string }
        lead_id: { type: [string, "null"], format: uuid }
        lead_headline: { type: [string, "null"] }
        description: { type: [string, "null"] }
        creator: { type: [string, "null"] }
        credit_line: { type: [string, "null"] }
        copyright_notice: { type: [string, "null"] }
        web_statement: { type: [string, "null"] }
        licensor: { type: [string, "null"] }
        digital_source_type: { type: [string, "null"] }
        licence: { type: [string, "null"] }
        licence_kind: { type: [string, "null"], enum: [press-kit, commons, null] }
        licence_url: { type: [string, "null"] }
        licence_recorded_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
