[project]
name = "anr-workspace"
version = "0.0.0"
requires-python = ">=3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "packages/schemas/python"]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "ruff>=0.17",
  "mypy>=2.4",
  "datamodel-code-generator>=0.86",
  "httpx2>=2.16",
  "boto3-stubs[s3]>=1.43.118",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["packages/schemas/python/anr_schemas/config", "packages/schemas/python/anr_schemas/formats"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.ruff.lint.isort]
known-first-party = ["anr_ingestion", "anr_verifier", "anr_schemas"]

# Libraries without type information; their values are Any at the boundary and checked there.
[[tool.mypy.overrides]]
module = ["feedparser", "py3langid", "lxml", "lxml.*"]
ignore_missing_imports = true
