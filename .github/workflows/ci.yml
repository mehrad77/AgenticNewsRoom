name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          python-version-file: .python-version
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
      # Database tests (RLS, tenancy check, normalize_text, config sync) run against Postgres
      # with the dev roles from .env.example.
      - run: cp .env.example .env
      - run: pnpm db:up
      - run: pnpm db:migrate
      - run: pnpm check
