# Generated by packages/telemetry/ops/gen.ts: edit that, then `pnpm gen`.
groups:
  - name: anr-slo
    interval: 1m
    rules:
      - record: anr:slots:increase28d
        expr: sum by (anr_newsroom) (increase(anr_slots_total[28d]))
      - record: anr:slots_bad:increase28d
        expr: sum by (anr_newsroom) (increase(anr_slots_total{anr_slot_outcome=~"late|missed"}[28d]))
      - record: anr:slots:budget_spent28d
        expr: (anr:slots_bad:increase28d / anr:slots:increase28d) / 0.05
      - record: anr:wal_bad:ratio5m
        expr: 1 - max(avg_over_time(anr_wal_ok[5m]))
      - record: anr:wal_bad:ratio30m
        expr: 1 - max(avg_over_time(anr_wal_ok[30m]))
      - record: anr:wal_bad:ratio1h
        expr: 1 - max(avg_over_time(anr_wal_ok[1h]))
      - record: anr:wal_bad:ratio6h
        expr: 1 - max(avg_over_time(anr_wal_ok[6h]))
      - record: anr:wal_bad:ratio28d
        expr: 1 - max(avg_over_time(anr_wal_ok[28d]))
      - record: anr:wal:budget_spent28d
        expr: anr:wal_bad:ratio28d / 0.005
