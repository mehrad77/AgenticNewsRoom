# Generated by packages/telemetry/ops/gen.ts: edit that, then `pnpm gen`.
groups:
  - name: anr
    rules:
      - alert: SlotMissed
        expr: sum by (anr_newsroom) (increase(anr_slots_total{anr_slot_outcome="missed"}[15m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.anr_newsroom }} missed a slot: see the desk's notices"
      - alert: SlotsErrorBudgetHalfSpent
        expr: anr:slots:budget_spent28d >= 0.5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.anr_newsroom }} has spent half its 28-day budget of late and missed slots"
      - alert: WalArchiveBurnFast
        expr: anr:wal_bad:ratio1h > 0.072 and anr:wal_bad:ratio5m > 0.072
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: WAL archiving burns its error budget 14.4 times too fast (1 h and 5 min)
      - alert: WalArchiveBurnSlow
        expr: anr:wal_bad:ratio6h > 0.03 and anr:wal_bad:ratio30m > 0.03
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: WAL archiving burns its error budget 6 times too fast (6 h and 30 min)
      - alert: BackupCheckFailed
        expr: max(anr_backup_last_ok{anr_backup_kind="check"}) == 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: The latest backup check failed
      - alert: BackupCheckMissing
        expr: time() - max(anr_backup_last_success_seconds{anr_backup_kind="check"}) > 3600 or (absent(anr_backup_last_success_seconds{anr_backup_kind="check"}) and on () count(anr_gauges_collected_seconds) > 0)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: No backup check has succeeded for an hour
      - alert: DiskLow
        expr: min by (anr_disk) (system_filesystem_usage_bytes{state="free", anr_disk!=""}) < 40e9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Under 40 GB free on the {{ $labels.anr_disk }} disk
      - alert: DiskCritical
        expr: min by (anr_disk) (system_filesystem_usage_bytes{state="free", anr_disk!=""}) < 20e9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Under 20 GB free on the {{ $labels.anr_disk }} disk
      - alert: HeartbeatLost
        expr: max by (anr_worker) (anr_heartbeat_age_seconds) > 180
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: The {{ $labels.anr_worker }} worker has not beaten for over 3 minutes
      - alert: GaugesStale
        expr: time() - max(anr_gauges_collected_seconds) > 300 or absent(anr_gauges_collected_seconds)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The agents worker has reported no platform gauges for 5 minutes
      - alert: NewsroomGaugesFailing
        expr: min by (anr_newsroom) (anr_gauges_newsroom_ok) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "The gauges of {{ $labels.anr_newsroom }} cannot be read: its panels show old values"
      - alert: TunnelDown
        expr: max(cloudflared_tunnel_ha_connections) < 1 or absent(cloudflared_tunnel_ha_connections)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: The Cloudflare Tunnel has no connection to Cloudflare's edge
      - alert: HoldRateSpike
        expr: sum by (anr_newsroom) (increase(anr_publications_holds_total[24h])) > 2 * sum by (anr_newsroom) (increase(anr_publications_holds_total[28d])) / (max by (anr_newsroom) (count_over_time(anr_publications_holds_total[28d:1h])) / 24) and sum by (anr_newsroom) (increase(anr_publications_holds_total[24h])) >= 3 and (max by (anr_newsroom) (count_over_time(anr_publications_holds_total[28d:1h])) / 24) >= 7
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.anr_newsroom }} held over twice its usual share of publications today"
