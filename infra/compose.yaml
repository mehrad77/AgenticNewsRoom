# Dev: `pnpm db:up` starts Postgres only (project `anr`); run the apps with `pnpm dev`.
# `pnpm telemetry:up` adds the collector and otel-lgtm (profile `telemetry`): Grafana on
# http://localhost:3000 (read-only viewer), OTLP on localhost:4318 (OTEL_EXPORTER_OTLP_ENDPOINT).
# Dev Postgres keeps Docker's json-file log: dev telemetry has the apps' logs only.
# Production is its own project, anr-prod, in infra/compose.prod.yaml (D126).
name: anr

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "5" }

services:
  postgres:
    build: { context: .., dockerfile: infra/docker/postgres.Dockerfile }
    image: anr-postgres:17
    environment:
      # Defaults are dev values; production sets every password (infra/AGENTS.md).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ANR_MIGRATOR_DB_PASSWORD: ${ANR_MIGRATOR_DB_PASSWORD:-anr_migrator}
      ANR_APP_DB_PASSWORD: ${ANR_APP_DB_PASSWORD:-anr_app}
      ANR_SYSTEM_DB_PASSWORD: ${ANR_SYSTEM_DB_PASSWORD:-anr_system}
      # anr_test holds the integration tests' data; production sets ANR_DATABASES=anr.
      ANR_DATABASES: ${ANR_DATABASES:-anr anr_test}
      # pgBackRest (infra/backup/): every option as an environment variable; the repository is
      # the R2 bucket, encrypted with the backup passphrase. Unused while archiving is off (dev).
      PGBACKREST_STANZA: anr
      PGBACKREST_PG1_PATH: /var/lib/postgresql/data
      PGBACKREST_REPO1_TYPE: s3
      PGBACKREST_REPO1_PATH: /pgbackrest
      PGBACKREST_REPO1_S3_BUCKET: ${ANR_BACKUP_BUCKET:-}
      PGBACKREST_REPO1_S3_ENDPOINT: ${ANR_BACKUP_S3_ENDPOINT:-${R2_ACCOUNT_ID:-}.r2.cloudflarestorage.com}
      PGBACKREST_REPO1_S3_REGION: ${ANR_BACKUP_S3_REGION:-auto}
      PGBACKREST_REPO1_S3_URI_STYLE: path
      PGBACKREST_REPO1_S3_KEY: ${R2_BACKUP_ACCESS_KEY_ID:-}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${R2_BACKUP_SECRET_ACCESS_KEY:-}
      PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
      PGBACKREST_REPO1_CIPHER_PASS: ${ANR_BACKUP_PASSPHRASE:-}
      PGBACKREST_REPO1_RETENTION_FULL: "4"
      PGBACKREST_COMPRESS_TYPE: zst
      PGBACKREST_START_FAST: "y"
      PGBACKREST_LOG_LEVEL_FILE: "off"
    # WAL archiving: on in production (ANR_WAL_ARCHIVE=on), off in dev and on a restored copy, which
    # must never push into the production repository. archive_timeout bounds data loss to 5 minutes.
    # Changing archive_mode needs a restart; compose recreates the container when it changes.
    command:
      - postgres
      - -c
      - archive_mode=${ANR_WAL_ARCHIVE:-off}
      - -c
      - archive_command=pgbackrest archive-push %p
      - -c
      - archive_timeout=300
    # Loopback only: never reachable from outside the server.
    ports: ["127.0.0.1:${ANR_PG_PORT:-5432}:5432"]
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during first-start init the server listens on its unix socket only, so a socket
      # check would pass while the roles are still being created.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      retries: 10

  # The same collector and otel-lgtm as production (compose.prod.yaml), with a read-only anonymous
  # viewer instead of the Access sign-in and no Telegram contact point.
  otel-collector:
    profiles: [telemetry]
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command: [--config=/etc/anr/collector.yaml]
    cap_drop: [ALL]
    read_only: true
    security_opt: [no-new-privileges:true]
    environment:
      ANR_COMPOSE_PROJECT: anr
    volumes:
      - ./observability/collector.yaml:/etc/anr/collector.yaml:ro
      - disk:/hostfs/volumes:ro
      - ./observability:/hostfs/host:ro
    ports: ["127.0.0.1:4318:4318", "127.0.0.1:24225:24224"]
    depends_on: [lgtm]
    restart: unless-stopped
    logging: *logging

  lgtm:
    profiles: [telemetry]
    image: grafana/otel-lgtm:0.40.0@sha256:72e05804790e6e0d8c0b70a6d5ff1f721ef7b203463374631e99aa3429bd0cf6
    entrypoint: [/etc/anr/grafana/start.sh]
    environment:
      ANR_GRAFANA_ANONYMOUS: Viewer
      PROMETHEUS_EXTRA_ARGS: --storage.tsdb.retention.time=30d
      TEMPO_EXTRA_ARGS: -backend-worker.compaction.block-retention=168h -backend-scheduler.provider.work.compaction.block-retention=168h -reporting.enabled=false
      LOKI_EXTRA_ARGS: -compactor.retention-enabled=true -store.retention=168h -compactor.delete-request-store=filesystem -reporting.enabled=false
    volumes:
      - lgtm:/data
      - ./observability/grafana/start.sh:/etc/anr/grafana/start.sh:ro
      - ./observability/grafana/provisioning:/etc/anr/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/anr/grafana/dashboards:ro
      - ./observability/prometheus/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./observability/prometheus/rules:/etc/anr/prometheus/rules:ro
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 10s
      retries: 30
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  lgtm:
  disk:
